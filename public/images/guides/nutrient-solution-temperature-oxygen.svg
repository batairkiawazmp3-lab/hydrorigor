<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" width="640" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Reservoir temperature and oxygen targets</title>
  <desc id="d">Solution temperature: Oklahoma State gives about 72 to 75 °F (22 to 24 °C); UF/IFAS gives 65 to 80 °F for lettuce; Sato and colleagues cite 13 to 18 °C as the lettuce root optimum and call a 28.3 °C tank too warm. Dissolved oxygen: Virginia Tech gives 7 to 10 ppm for deep water culture with 4 ppm as the minimum; Kentucky gives 6 to 8 ppm; UF/IFAS gives 5 mg/L for lettuce rafts; oxygen below 8 mg/L reduced calcium, potassium and phosphorus uptake in work cited by Sato. Warm water holds less oxygen, so keep the reservoir cool and aerated.</desc>
  <rect width="640" height="1000" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Reservoir: cool and airy</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">What the sources give, side by side</text>
    <rect x="20" y="118" width="600" height="390" rx="18" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <rect x="20" y="118" width="14" height="390" rx="7" fill="#3A7CA5"/>
    <text x="56" y="162" font-size="24" font-weight="800" fill="#0E1A14">Solution temperature</text>
    <text x="56" y="204" font-size="22" font-weight="800" fill="#0F6B4F">72–75 °F (22–24 °C)</text>
    <text x="56" y="236" font-size="20" fill="#5B6B62">Oklahoma State</text>
    <text x="56" y="280" font-size="22" font-weight="800" fill="#0F6B4F">65–80 °F for lettuce</text>
    <text x="56" y="312" font-size="20" fill="#5B6B62">UF/IFAS</text>
    <text x="56" y="356" font-size="22" font-weight="800" fill="#0F6B4F">13–18 °C (55–64 °F)</text>
    <text x="56" y="388" font-size="21" fill="#3F5248">Lettuce root optimum, cited</text>
    <text x="56" y="420" font-size="20" fill="#5B6B62">Sato et al. 2007</text>
    <text x="56" y="462" font-size="21" fill="#9A3B2E">28.3 °C tank: too warm</text>
    <text x="56" y="492" font-size="20" fill="#5B6B62">Sato et al. 2007</text>
    <rect x="20" y="528" width="600" height="400" rx="18" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <rect x="20" y="528" width="14" height="400" rx="7" fill="#2E8B57"/>
    <text x="56" y="572" font-size="24" font-weight="800" fill="#0E1A14">Dissolved oxygen</text>
    <text x="56" y="614" font-size="22" font-weight="800" fill="#0F6B4F">7–10 ppm, 4 ppm minimum</text>
    <text x="56" y="646" font-size="20" fill="#5B6B62">Virginia Tech (DWC)</text>
    <text x="56" y="690" font-size="22" font-weight="800" fill="#0F6B4F">6–8 ppm</text>
    <text x="56" y="722" font-size="20" fill="#5B6B62">Kentucky (lettuce DWC)</text>
    <text x="56" y="766" font-size="22" font-weight="800" fill="#0F6B4F">5 mg/L</text>
    <text x="56" y="798" font-size="20" fill="#5B6B62">UF/IFAS (lettuce rafts)</text>
    <text x="56" y="842" font-size="21" fill="#9A3B2E">Below 8 mg/L: less Ca, K, P</text>
    <text x="56" y="874" font-size="20" fill="#5B6B62">Older study cited by Sato</text>
    <text x="56" y="910" font-size="20" fill="#3F5248">1 ppm = 1 mg/L in water</text>
    <text x="20" y="968" font-size="20" fill="#3F5248">Warm water holds less oxygen</text>
  </g>
</svg>
