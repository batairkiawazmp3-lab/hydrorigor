<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 920" width="640" height="920" role="img" aria-labelledby="t d">
  <title id="t">Hydroponic cilantro from seed to harvest</title>
  <desc id="d">Week 0: sow, germinates in soil at 55 to 68 degrees F. Week 3: transplant. Day 40 to 60: harvest window. Week 7: Iowa State trial harvest, 4 weeks after transplant. Day 49 under 16 hour days: flower buds form.</desc>
  <rect width="640" height="920" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Cilantro: seed to harvest</text>
    <text x="20" y="88" font-size="20" fill="#3F5248">Key days from sowing</text>
    <line x1="80" y1="140" x2="80" y2="860" stroke="#9DBFAE" stroke-width="6"/>
    <circle cx="80" cy="160" r="16" fill="#2E8B63"/>
    <text x="120" y="156" font-size="24" font-weight="800" fill="#0E1A14">Day 0: sow</text>
    <text x="120" y="188" font-size="20" fill="#3F5248">Germinates at 55–68 °F</text>
    <text x="120" y="216" font-size="20" fill="#3F5248">Oregon State</text>
    <circle cx="80" cy="310" r="16" fill="#2E8B63"/>
    <text x="120" y="306" font-size="24" font-weight="800" fill="#0E1A14">Week 3: transplant</text>
    <text x="120" y="338" font-size="20" fill="#3F5248">8 in (20 cm) apart</text>
    <text x="120" y="366" font-size="20" fill="#3F5248">Currey et al. 2019</text>
    <rect x="40" y="430" width="580" height="250" rx="14" fill="#FFFFFF" stroke="#2E8B63" stroke-width="3"/>
    <circle cx="80" cy="470" r="16" fill="#1F5E7A"/>
    <text x="120" y="466" font-size="24" font-weight="800" fill="#0E1A14">Day 40–60: harvest</text>
    <text x="120" y="498" font-size="20" fill="#3F5248">OMAFRA window</text>
    <circle cx="80" cy="580" r="16" fill="#1F5E7A"/>
    <text x="120" y="576" font-size="24" font-weight="800" fill="#0E1A14">Week 7: trial harvest</text>
    <text x="120" y="608" font-size="20" fill="#3F5248">4 weeks after transplant</text>
    <text x="120" y="636" font-size="20" fill="#3F5248">Currey et al. 2019</text>
    <circle cx="80" cy="770" r="16" fill="#C2533A"/>
    <text x="120" y="766" font-size="24" font-weight="800" fill="#C2533A">Day 49: flower buds</text>
    <text x="120" y="798" font-size="20" fill="#3F5248">Under 16 h days; day 73 at 8 h</text>
    <text x="120" y="826" font-size="20" fill="#3F5248">Tomitaka et al. 2001</text>
    <text x="20" y="900" font-size="20" fill="#3F5248">Cut before the flower stalk rises</text>
  </g>
</svg>
