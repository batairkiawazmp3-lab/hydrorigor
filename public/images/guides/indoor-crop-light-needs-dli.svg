<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 950" width="640" height="950" role="img" aria-labelledby="t d">
  <title id="t">How much light indoor crops need</title>
  <desc id="d">Daily light integral (DLI) targets in mol per square metre per day. Purdue Extension: seedlings and cuttings 8 to 10, potted plants 10 to 15, leafy greens 15 to 20, tomatoes and strawberries more than 20. University of Kentucky: lettuce 12 to 17. Virginia Tech: 17 or more favoured higher yields of greens and herbs. A shaded band shows that a Purdue greenhouse in Indiana received under 10 from November through February. DLI equals light intensity in micromoles per square metre per second, times hours on, times 0.0036.</desc>
  <rect width="640" height="950" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">How much light crops need</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Daily light integral (DLI), mol/m²/day.</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">Purdue HO-283-W, Kentucky CCD-CP-63, Virginia Tech</text>
    <rect x="24" y="196" width="224" height="564" fill="#E7E3D8"/>
    <path d="M24 196 L24 760" stroke="#D3DAD5" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="24" y="790" font-size="20" fill="#3F5248" text-anchor="middle">0</text>
    <path d="M136 196 L136 760" stroke="#D3DAD5" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="136" y="790" font-size="20" fill="#3F5248" text-anchor="middle">5</text>
    <path d="M248 196 L248 760" stroke="#D3DAD5" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="248" y="790" font-size="20" fill="#3F5248" text-anchor="middle">10</text>
    <path d="M360 196 L360 760" stroke="#D3DAD5" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="360" y="790" font-size="20" fill="#3F5248" text-anchor="middle">15</text>
    <path d="M472 196 L472 760" stroke="#D3DAD5" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="472" y="790" font-size="20" fill="#3F5248" text-anchor="middle">20</text>
    <path d="M584 196 L584 760" stroke="#D3DAD5" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="584" y="790" font-size="20" fill="#3F5248" text-anchor="middle">25</text>
    <text x="20" y="176" font-size="20" fill="#5B6F64">Shaded: Indiana greenhouse, Nov–Feb, under 10</text>
    <text x="24" y="236" font-size="21" font-weight="700" fill="#0E1A14">Seedlings and cuttings<tspan font-weight="400" fill="#5B6F64"> · Purdue</tspan></text>
    <text x="616" y="236" font-size="22" font-weight="800" fill="#0F6B4F" text-anchor="end">8–10</text>
    <rect x="203.2" y="250" width="44.8" height="32" rx="5" fill="#0F6B4F"/>
    <text x="24" y="328" font-size="21" font-weight="700" fill="#0E1A14">Potted plants<tspan font-weight="400" fill="#5B6F64"> · Purdue</tspan></text>
    <text x="616" y="328" font-size="22" font-weight="800" fill="#0F6B4F" text-anchor="end">10–15</text>
    <rect x="248.0" y="342" width="112.0" height="32" rx="5" fill="#0F6B4F"/>
    <text x="24" y="420" font-size="21" font-weight="700" fill="#0E1A14">Lettuce<tspan font-weight="400" fill="#5B6F64"> · Kentucky</tspan></text>
    <text x="616" y="420" font-size="22" font-weight="800" fill="#0F6B4F" text-anchor="end">12–17</text>
    <rect x="292.8" y="434" width="112.0" height="32" rx="5" fill="#0F6B4F"/>
    <text x="24" y="512" font-size="21" font-weight="700" fill="#0E1A14">Leafy greens<tspan font-weight="400" fill="#5B6F64"> · Purdue</tspan></text>
    <text x="616" y="512" font-size="22" font-weight="800" fill="#0F6B4F" text-anchor="end">15–20</text>
    <rect x="360.0" y="526" width="112.0" height="32" rx="5" fill="#0F6B4F"/>
    <text x="24" y="604" font-size="21" font-weight="700" fill="#0E1A14">Greens and herbs<tspan font-weight="400" fill="#5B6F64"> · Virginia Tech</tspan></text>
    <text x="616" y="604" font-size="22" font-weight="800" fill="#0F6B4F" text-anchor="end">17 or more</text>
    <rect x="404.8" y="618" width="179.2" height="32" rx="5" fill="#0F6B4F"/>
    <path d="M582.0 612 L600.0 634 L582.0 656 Z" fill="#0F6B4F"/>
    <text x="416.8" y="641" font-size="20" font-weight="800" fill="#FFFFFF">higher yields</text>
    <text x="24" y="696" font-size="21" font-weight="700" fill="#0E1A14">Tomatoes, strawberries<tspan font-weight="400" fill="#5B6F64"> · Purdue</tspan></text>
    <text x="616" y="696" font-size="22" font-weight="800" fill="#0F6B4F" text-anchor="end">more than 20</text>
    <rect x="472.0" y="710" width="112.0" height="32" rx="5" fill="#0F6B4F"/>
    <path d="M582.0 704 L600.0 726 L582.0 748 Z" fill="#0F6B4F"/>
    <text x="304" y="818" font-size="20" fill="#3F5248" text-anchor="middle">mol/m²/day · arrow = no upper limit given</text>
    <rect x="20" y="836" width="600" height="56" rx="12" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="872" font-size="21" font-weight="800" fill="#0E1A14">DLI = µmol/m²/s × hours on × 0.0036</text>
    <text x="20" y="928" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
