<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" role="img" aria-labelledby="t d">
  <title id="t">NFT flow rate per channel: what four sources say</title>
  <desc id="d">A bar chart of recommended NFT flow per channel in liters per minute. Virginia Tech, for small systems: 3 to 5 gallons per hour, about 0.19 to 0.32 liters per minute. Purdue: 1 liter per minute, upper limit 2. Sato and colleagues, citing earlier work: 1 to 2 liters per minute widely recommended. Alabama Extension: usually less than half a gallon per minute, under about 1.9 liters per minute. Home channels are short, so the low Virginia Tech figure is the starting point.</desc>
  <rect width="640" height="820" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">NFT flow per channel</text>
    <text x="20" y="88" font-size="20" fill="#3F5248">Liters per minute; scale 0 to 2</text>
    <!-- VT -->
    <rect x="20" y="120" width="600" height="140" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="160" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Virginia Tech (small)</text>
    <rect x="40" y="178" width="560" height="26" rx="13" fill="#E6ECE4"/>
    <rect x="93" y="178" width="37" height="26" rx="8" fill="#2E8B63"/>
    <text x="40" y="240" font-size="21" fill="#3F5248">3–5 gal/h = 0.19–0.32 L/min</text>
    <!-- Purdue -->
    <rect x="20" y="276" width="600" height="140" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="316" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Purdue</text>
    <rect x="40" y="334" width="560" height="26" rx="13" fill="#E6ECE4"/>
    <rect x="40" y="334" width="280" height="26" rx="13" fill="#1F6E8C"/>
    <rect x="320" y="334" width="280" height="26" rx="13" fill="#9CCBDB"/>
    <text x="40" y="396" font-size="21" fill="#3F5248">1 L/min; upper limit 2 L/min</text>
    <!-- Sato -->
    <rect x="20" y="432" width="600" height="140" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="472" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Sato et al. (cited)</text>
    <rect x="40" y="490" width="560" height="26" rx="13" fill="#E6ECE4"/>
    <rect x="320" y="490" width="280" height="26" rx="13" fill="#1F6E8C"/>
    <text x="40" y="552" font-size="21" fill="#3F5248">1–2 L/min widely recommended</text>
    <!-- Alabama -->
    <rect x="20" y="588" width="600" height="140" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="628" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Alabama Extension</text>
    <rect x="40" y="646" width="560" height="26" rx="13" fill="#E6ECE4"/>
    <rect x="40" y="646" width="532" height="26" rx="13" fill="#E9C46A"/>
    <text x="40" y="708" font-size="21" fill="#3F5248">Usually under ½ gal/min (1.9 L/min)</text>
    <text x="20" y="772" font-size="20" fill="#3F5248">Short home channels: start low,</text>
    <text x="20" y="800" font-size="20" fill="#3F5248">raise flow until the film reaches the end</text>
  </g>
</svg>
