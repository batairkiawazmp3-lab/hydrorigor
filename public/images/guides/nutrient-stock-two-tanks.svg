<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" role="img" aria-labelledby="t d">
  <title id="t">Two-tank stock concentrate system</title>
  <desc id="d">Tank 1 holds monopotassium phosphate, magnesium sulfate and potassium sulfate or nitrate. Tank 2 holds calcium nitrate, calcium chloride and iron chelate. Never mix the two concentrates; dilute each into the reservoir water, 1 part in 100 for a 100X stock.</desc>
  <rect width="640" height="900" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Two stock tanks</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="90" font-size="20" fill="#3F5248">Keep calcium apart at 100X</text>
    <text x="20" y="118" font-size="20" fill="#3F5248">(Ohio State HYG-1437, Penn State)</text>
    <rect x="20" y="160" width="280" height="380" rx="20" fill="#FFFFFF" stroke="#3B7FB0" stroke-width="4"/>
    <rect x="20" y="160" width="280" height="64" rx="20" fill="#3B7FB0"/>
    <text x="160" y="203" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Tank 1</text>
    <text x="40" y="272" font-size="21" fill="#0E1A14">Monopotassium</text>
    <text x="40" y="312" font-size="21" fill="#0E1A14">phosphate</text>
    <text x="40" y="352" font-size="21" fill="#0E1A14">Magnesium sulfate</text>
    <text x="40" y="392" font-size="21" fill="#0E1A14">Potassium sulfate</text>
    <text x="40" y="432" font-size="21" fill="#0E1A14">or nitrate</text>
    <rect x="340" y="160" width="280" height="380" rx="20" fill="#FFFFFF" stroke="#E0A23B" stroke-width="4"/>
    <rect x="340" y="160" width="280" height="64" rx="20" fill="#E0A23B"/>
    <text x="480" y="203" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Tank 2</text>
    <text x="360" y="272" font-size="21" fill="#0E1A14">Calcium nitrate</text>
    <text x="360" y="312" font-size="21" fill="#0E1A14">Calcium chloride</text>
    <text x="360" y="352" font-size="21" fill="#0E1A14">Iron chelate</text>
    <text x="320" y="590" font-size="24" font-weight="800" fill="#D1603D" text-anchor="middle">Never mix them</text>
    <path d="M160 540 L160 650 L290 700" stroke="#3B7FB0" stroke-width="5" fill="none"/>
    <path d="M480 540 L480 650 L350 700" stroke="#E0A23B" stroke-width="5" fill="none"/>
    <rect x="120" y="700" width="400" height="110" rx="20" fill="#DCEFE3" stroke="#2E8B57" stroke-width="3"/>
    <text x="320" y="745" font-size="24" font-weight="800" fill="#0E1A14" text-anchor="middle">Reservoir water</text>
    <text x="320" y="782" font-size="21" fill="#3F5248" text-anchor="middle">Each diluted 1 in 100</text>
    <text x="20" y="878" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
