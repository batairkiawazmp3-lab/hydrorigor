<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 990" width="640" height="990" role="img" aria-labelledby="t d">
  <title id="t">Hydroponic basil from seed to harvest</title>
  <desc id="d">A timeline from a University of Florida study of basil in small home-style hydroponic units. Day 0: sow. Day 22: transplant four plants into a 2-gallon (7.6-liter) aerated deep water culture unit. Leaves can be harvested from as early as 6 weeks after sowing, about 3 weeks after transplant. Week 4 after transplant: pinch the tops. Week 6 after transplant: pinch again; the study grew plants for 8 weeks after transplant. Every one to two weeks: top up the solution; replacing it did not change growth, and indoors the authors suggest using less fertilizer when topping up.</desc>
