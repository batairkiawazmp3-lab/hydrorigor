<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" role="img" aria-labelledby="t d">
  <title id="t">EC targets for hydroponic herbs</title>
  <desc id="d">EC in mS/cm on a 0 to 4 scale. Basil 1.0 to 1.6 and sage 1.0 to 1.6, Oklahoma State. Parsley 1.8 to 2.2, Oklahoma State. Mixed herbs 1.2 to 2.0, Virginia Tech. Iowa State trials found the same yields of basil, parsley, dill and cilantro anywhere from 0.5 to 4.0.</desc>
  <rect width="640" height="900" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Herb EC targets</text>
    <text x="20" y="88" font-size="20" fill="#3F5248">EC in mS/cm, scale 0 to 4</text>
    <line x1="40" y1="120" x2="600" y2="120" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="112" font-size="20" fill="#3F5248" text-anchor="middle">0</text>
    <text x="180" y="112" font-size="20" fill="#3F5248" text-anchor="middle">1</text>
    <text x="320" y="112" font-size="20" fill="#3F5248" text-anchor="middle">2</text>
    <text x="460" y="112" font-size="20" fill="#3F5248" text-anchor="middle">3</text>
    <text x="600" y="112" font-size="20" fill="#3F5248" text-anchor="middle">4</text>
    <line x1="180" y1="120" x2="180" y2="760" stroke="#CFE3D6" stroke-width="2"/>
    <line x1="320" y1="120" x2="320" y2="760" stroke="#CFE3D6" stroke-width="2"/>
    <line x1="460" y1="120" x2="460" y2="760" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="180" font-size="22" font-weight="700" fill="#0E1A14">Basil</text>
    <rect x="180" y="194" width="84" height="36" rx="6" fill="#2E8B63"/>
    <text x="278" y="221" font-size="22" font-weight="700" fill="#0E1A14">1.0–1.6</text>
    <text x="40" y="290" font-size="22" font-weight="700" fill="#0E1A14">Sage</text>
    <rect x="180" y="304" width="84" height="36" rx="6" fill="#2E8B63"/>
    <text x="278" y="331" font-size="22" font-weight="700" fill="#0E1A14">1.0–1.6</text>
    <text x="40" y="400" font-size="22" font-weight="700" fill="#0E1A14">Parsley</text>
    <rect x="292" y="414" width="56" height="36" rx="6" fill="#1F6E8C"/>
    <text x="362" y="441" font-size="22" font-weight="700" fill="#0E1A14">1.8–2.2</text>
    <text x="40" y="510" font-size="22" font-weight="700" fill="#0E1A14">Mixed herbs</text>
    <rect x="208" y="524" width="112" height="36" rx="6" fill="#C2533A"/>
    <text x="334" y="551" font-size="22" font-weight="700" fill="#0E1A14">1.2–2.0</text>
    <text x="40" y="620" font-size="22" font-weight="700" fill="#0E1A14">Same yields</text>
    <rect x="110" y="634" width="490" height="36" rx="6" fill="#9DBFAE"/>
    <text x="120" y="661" font-size="22" font-weight="700" fill="#0E1A14">0.5–4.0</text>
    <text x="40" y="710" font-size="20" fill="#3F5248">Basil, parsley, dill, cilantro</text>
    <rect x="20" y="790" width="600" height="90" rx="12" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="828" font-size="21" font-weight="700" fill="#0E1A14">Shared pH: about 6.0</text>
    <text x="40" y="860" font-size="20" fill="#3F5248">Oklahoma State; Virginia Tech; Iowa State</text>
  </g>
</svg>
