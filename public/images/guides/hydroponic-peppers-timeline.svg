<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" width="640" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Hydroponic pepper timeline from seed to harvest</title>
  <desc id="d">Sow seed and grow seedlings 4 to 8 weeks. Transplant into at least 4 gallons per plant. At 3 weeks after transplant remove the first flowers; from 4 weeks train two stems. First green fruit about 70 to 85 days after transplant; bell types 75 to 80 days. Chile types about 100 days to mature green and 140 days to red ripe. Keep picking every 7 to 14 days.</desc>
  <rect width="640" height="1000" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Seed to harvest</text>
    <text x="20" y="86" font-size="20" fill="#3F5248">Days counted from transplant</text>

    <path d="M80 140 L80 930" stroke="#CFE3D6" stroke-width="6"/>

    <circle cx="80" cy="150" r="30" fill="#1F6E8C"/>
    <text x="80" y="161" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">1</text>
    <text x="130" y="142" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Seedlings</text>
    <text x="130" y="178" font-size="21" fill="#3F5248">4–8 weeks in plugs</text>

    <circle cx="80" cy="300" r="30" fill="#1F6E8C"/>
    <text x="80" y="311" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">2</text>
    <text x="130" y="292" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Transplant (day 0)</text>
    <text x="130" y="328" font-size="21" fill="#3F5248">4+ gallons (15 L) per plant</text>

    <circle cx="80" cy="450" r="30" fill="#1F6E8C"/>
    <text x="80" y="461" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">3</text>
    <text x="130" y="442" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Week 3</text>
    <text x="130" y="478" font-size="21" fill="#3F5248">Remove the first flowers</text>

    <circle cx="80" cy="600" r="30" fill="#1F6E8C"/>
    <text x="80" y="611" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">4</text>
    <text x="130" y="592" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Week 4 on</text>
    <text x="130" y="628" font-size="21" fill="#3F5248">Train two stems, tie up</text>

    <circle cx="80" cy="750" r="30" fill="#2E8B63"/>
    <text x="80" y="761" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">5</text>
    <text x="130" y="742" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Day 70–85</text>
    <text x="130" y="778" font-size="21" fill="#3F5248">First green bell peppers</text>

    <circle cx="80" cy="900" r="30" fill="#C2533A"/>
    <text x="80" y="911" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">6</text>
    <text x="130" y="892" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Day 100–140</text>
    <text x="130" y="928" font-size="21" fill="#3F5248">Chiles green, then red</text>
  </g>
</svg>
