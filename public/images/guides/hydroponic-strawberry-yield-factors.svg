<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" width="640" height="960" role="img" aria-labelledby="t d">
  <title id="t">What changed hydroponic strawberry yield in trials</title>
  <desc id="d">16-hour days gave 372 to 989 percent more fruit than 12-hour days; LED light in a dim winter greenhouse gave about twice the yield of daylight alone; drip-fed substrate gave 144 percent more fruit than water culture; far-red light added 48 percent in Albion but nothing in Monterey; above 86 degrees Fahrenheit, 30 Celsius, new flowers stopped.</desc>
  <rect width="640" height="960" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">What moves the yield</text>
    <text x="20" y="88" font-size="20" fill="#3F5248">Effects measured in university trials</text>
    <rect x="20" y="120" width="600" height="138" rx="14" fill="#FFFFFF" stroke="#2E8B63" stroke-width="3"/>
    <rect x="20" y="120" width="14" height="138" rx="7" fill="#2E8B63"/>
    <text x="54" y="160" font-size="22" font-weight="800" fill="#0E1A14">16-hour days</text>
    <text x="54" y="200" font-size="26" font-weight="800" fill="#2E5E48">372–989% more fruit</text>
    <text x="54" y="236" font-size="20" fill="#3F5248">than 12-hour days</text>
    <rect x="20" y="278" width="600" height="138" rx="14" fill="#FFFFFF" stroke="#2E8B63" stroke-width="3"/>
    <rect x="20" y="278" width="14" height="138" rx="7" fill="#2E8B63"/>
    <text x="54" y="318" font-size="22" font-weight="800" fill="#0E1A14">LED in a dim greenhouse</text>
    <text x="54" y="358" font-size="26" font-weight="800" fill="#2E5E48">About twice the yield</text>
    <text x="54" y="394" font-size="20" fill="#3F5248">of daylight alone</text>
    <rect x="20" y="436" width="600" height="138" rx="14" fill="#FFFFFF" stroke="#9DBFAE" stroke-width="3"/>
    <rect x="20" y="436" width="14" height="138" rx="7" fill="#9DBFAE"/>
    <text x="54" y="476" font-size="22" font-weight="800" fill="#0E1A14">Substrate with drip</text>
    <text x="54" y="516" font-size="26" font-weight="800" fill="#2E5E48">144% more fruit</text>
    <text x="54" y="552" font-size="20" fill="#3F5248">than water culture</text>
    <rect x="20" y="594" width="600" height="138" rx="14" fill="#FFFFFF" stroke="#D9A23A" stroke-width="3"/>
    <rect x="20" y="594" width="14" height="138" rx="7" fill="#D9A23A"/>
    <text x="54" y="634" font-size="22" font-weight="800" fill="#0E1A14">Far-red light</text>
    <text x="54" y="674" font-size="26" font-weight="800" fill="#2E5E48">+48% in Albion</text>
    <text x="54" y="710" font-size="20" fill="#3F5248">no gain in Monterey</text>
    <rect x="20" y="752" width="600" height="138" rx="14" fill="#FFFFFF" stroke="#C2533A" stroke-width="3"/>
    <rect x="20" y="752" width="14" height="138" rx="7" fill="#C2533A"/>
    <text x="54" y="792" font-size="22" font-weight="800" fill="#0E1A14">Above 86 °F (30 °C)</text>
    <text x="54" y="832" font-size="26" font-weight="800" fill="#2E5E48">No new flowers</text>
    <text x="54" y="868" font-size="20" fill="#3F5248">crop stops</text>
    <text x="20" y="936" font-size="20" fill="#3F5248">Park 2023; Cornell 2020; Hutchinson 2025</text>
  </g>
</svg>
