<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1225" width="640" height="1225" role="img" aria-labelledby="t d">
  <title id="t">Inside a DIY deep water culture tote</title>
  <desc id="d">A labeled cross-section of a DIY deep water culture tank. Check pH weekly and keep it around 5.8 to 6.2. 1: a floating foam board, cut to fit loosely so it floats, with no gaps that let light in. 2: seedlings in rockwool or coir cubes whose bottoms reach the solution. 3: the sides are covered to block light and stop algae. 4: an air stone on the bottom; aim for 7 to 10 ppm dissolved oxygen, with 4 ppm as the minimum. 5: a check valve in the air line stops water flowing back to the pump. 6: the air pump sits outside the tank, never in the water. 7: a drain valve near the bottom for emptying. 8: a level floor, because a full tank is heavy; keep the bottom level to within 1 inch.</desc>
