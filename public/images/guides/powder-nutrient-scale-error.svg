<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" role="img" aria-labelledby="t d">
  <title id="t">Weighing error for a 1.5 g per gallon dose</title>
  <desc id="d">Possible weighing error for magnesium sulfate at 1.5 grams per gallon. Whole-gram scale: about 33 percent for 1 gallon, 7 percent for 5 gallons, 4 percent for 10 gallons. Scale reading 0.1 gram: about 3 percent for 1 gallon, under 1 percent for 5 and 10 gallons.</desc>
  <rect width="640" height="900" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Scale error by batch</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="90" font-size="20" fill="#3F5248">Epsom salt, 1.5 g per gallon</text>
    <text x="20" y="118" font-size="20" fill="#3F5248">(Masterblend rate; error is arithmetic)</text>
    <rect x="20" y="146" width="24" height="24" fill="#D1603D"/>
    <text x="54" y="166" font-size="20" fill="#0E1A14">Whole-gram scale</text>
    <rect x="330" y="146" width="24" height="24" fill="#2E8B57"/>
    <text x="364" y="166" font-size="20" fill="#0E1A14">0.1 g scale</text>
    <text x="20" y="240" font-size="24" font-weight="800" fill="#0E1A14">1 gallon (1.5 g)</text>
    <rect x="20" y="260" width="540" height="44" rx="6" fill="#D1603D"/>
    <text x="545" y="290" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="end">33%</text>
    <rect x="20" y="314" width="49" height="44" rx="6" fill="#2E8B57"/>
    <text x="80" y="344" font-size="22" font-weight="800" fill="#0E1A14">3%</text>
    <text x="20" y="430" font-size="24" font-weight="800" fill="#0E1A14">5 gallons (about 7 g)</text>
    <rect x="20" y="450" width="115" height="44" rx="6" fill="#D1603D"/>
    <text x="146" y="480" font-size="22" font-weight="800" fill="#0E1A14">7%</text>
    <rect x="20" y="504" width="12" height="44" rx="4" fill="#2E8B57"/>
    <text x="44" y="534" font-size="22" font-weight="800" fill="#0E1A14">under 1%</text>
    <text x="20" y="620" font-size="24" font-weight="800" fill="#0E1A14">10 gallons (14 g)</text>
    <rect x="20" y="640" width="65" height="44" rx="6" fill="#D1603D"/>
    <text x="96" y="670" font-size="22" font-weight="800" fill="#0E1A14">4%</text>
    <rect x="20" y="694" width="8" height="44" rx="3" fill="#2E8B57"/>
    <text x="40" y="724" font-size="22" font-weight="800" fill="#0E1A14">under 1%</text>
    <text x="20" y="800" font-size="21" fill="#3F5248">Small powder batches need</text>
    <text x="20" y="830" font-size="21" fill="#3F5248">a scale that reads 0.1 g</text>
    <text x="20" y="878" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
