<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">Hydroponic lettuce quick reference</title>
  <desc id="d">A lettuce head floating on a raft over aerated solution, beside target cards: pH 5.5 to 6.0, EC about 1.5, daily light 12 to 17 mol per square metre per day, days up to 24 °C and nights up to 18 °C, and harvest 3 to 5 weeks after transplanting.</desc>
  <rect width="960" height="540" fill="#F5F7F2"/>
  <text x="40" y="58" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E1A14">Hydroponic lettuce: the targets</text>
  <text x="40" y="88" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3F5248">Starting points from University of Kentucky and UF/IFAS extension work</text>

  <rect x="40" y="114" width="380" height="390" rx="18" fill="#FFFFFF" stroke="#DCE4DD" stroke-width="2"/>
  <ellipse cx="230" cy="232" rx="118" ry="64" fill="#0F6B4F"/>
  <ellipse cx="180" cy="214" rx="70" ry="48" fill="#3E9B6A"/>
  <ellipse cx="280" cy="214" rx="70" ry="48" fill="#3E9B6A"/>
  <ellipse cx="230" cy="196" rx="62" ry="48" fill="#7FC48E"/>
  <path d="M230 160v76M204 184l26 26 26-26" fill="none" stroke="#E3F1E8" stroke-width="4" stroke-linecap="round"/>
  <rect x="80" y="282" width="300" height="22" rx="6" fill="#E9E2D4" stroke="#B9AE98" stroke-width="2"/>
  <rect x="80" y="304" width="300" height="160" rx="10" fill="#E3F1E8" stroke="#CFE3D6" stroke-width="2"/>
  <path d="M220 304c-6 40-14 80-26 130M230 304c0 50 2 90-2 140M240 304c8 40 18 80 30 126" fill="none" stroke="#EADFC8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="320" cy="440" r="6" fill="#FFFFFF"/><circle cx="330" cy="420" r="4" fill="#FFFFFF"/><circle cx="312" cy="404" r="5" fill="#FFFFFF"/>
  <rect x="300" y="452" width="40" height="10" rx="5" fill="#0E1A14"/>
  <text x="62" y="490" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3F5248">Raft over aerated solution · DO 6–8 ppm</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="448" y="114" width="226" height="118" rx="16" fill="#0E1A14"/>
    <text x="468" y="146" font-size="14" fill="#C6F35E">Solution pH</text>
    <text x="468" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700" fill="#FFFFFF">5.5–6.0</text>
    <text x="468" y="216" font-size="13" fill="#E3F1E8">Tap water often starts above 7</text>

    <rect x="694" y="114" width="226" height="118" rx="16" fill="#0F6B4F"/>
    <text x="714" y="146" font-size="14" fill="#E3F1E8">EC (feed strength)</text>
    <text x="714" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700" fill="#FFFFFF">~1.5</text>
    <text x="714" y="216" font-size="13" fill="#E3F1E8">mS/cm · seedlings ~1.0</text>

    <rect x="448" y="250" width="226" height="118" rx="16" fill="#E3F1E8" stroke="#CFE3D6" stroke-width="2"/>
    <text x="468" y="282" font-size="14" fill="#3F5248">Daily light (DLI)</text>
    <text x="468" y="326" font-family="JetBrains Mono, Consolas, monospace" font-size="30" font-weight="700" fill="#0E1A14">12–17</text>
    <text x="468" y="352" font-size="13" fill="#3F5248">mol/m²/day · 200–300 µmol</text>

    <rect x="694" y="250" width="226" height="118" rx="16" fill="#E3F1E8" stroke="#CFE3D6" stroke-width="2"/>
    <text x="714" y="282" font-size="14" fill="#3F5248">Day / night max</text>
    <text x="714" y="326" font-family="JetBrains Mono, Consolas, monospace" font-size="28" font-weight="700" fill="#0E1A14">24 / 18 °C</text>
    <text x="714" y="352" font-size="13" fill="#3F5248">75 / 65 °F · heat = bolting</text>

    <rect x="448" y="386" width="472" height="118" rx="16" fill="#FFFFFF" stroke="#DCE4DD" stroke-width="2"/>
    <circle cx="492" cy="445" r="20" fill="#3E9B6A"/>
    <path d="M482 445 L 489 452 L 503 437" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="528" y="430" font-size="17" font-weight="700" fill="#0E1A14">Transplant at 14–21 days</text>
    <text x="528" y="454" font-size="14" fill="#3F5248">Harvest 21–35 days after transplanting</text>
    <text x="528" y="478" font-size="14" fill="#3F5248">Start with butterhead or looseleaf types</text>
  </g>
</svg>
