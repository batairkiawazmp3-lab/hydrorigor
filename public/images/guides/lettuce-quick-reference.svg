<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 935" width="640" height="935" role="img" aria-labelledby="t d">
  <title id="t">Hydroponic lettuce targets at a glance</title>
  <desc id="d">A lettuce head floating on a raft over aerated solution with dissolved oxygen at 6 to 8 ppm, beside target cards: solution pH 5.5 to 6.0 (tap water often starts above 7); EC about 1.5 mS/cm, about 1.0 for seedlings; daily light 12 to 17 mol per square metre per day, 200 to 300 µmol; days up to 24 °C (75 °F) and nights up to 18 °C (65 °F), because heat causes bolting. Transplant at 14 to 21 days, harvest 21 to 35 days after transplanting, and start with butterhead or looseleaf types.</desc>
  <rect width="640" height="935" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Hydroponic lettuce: targets</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Starting points from University of Kentucky</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">and UF/IFAS extension work</text>
    <rect x="20" y="150" width="600" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <rect x="40" y="250" width="230" height="60" rx="6" fill="#BFDDF0"/>
    <rect x="36" y="238" width="238" height="16" rx="3" fill="#E9E2D4" stroke="#3F5248" stroke-width="2"/>
    <ellipse cx="127.5" cy="212.5" rx="20.0" ry="32.5" transform="rotate(-40 127.5 212.5)" fill="#7FC48E" stroke="#5FA672" stroke-width="1.5"/>
    <ellipse cx="182.5" cy="212.5" rx="20.0" ry="32.5" transform="rotate(40 182.5 212.5)" fill="#7FC48E" stroke="#5FA672" stroke-width="1.5"/>
    <ellipse cx="142.5" cy="197.5" rx="17.5" ry="35.0" transform="rotate(-12 142.5 197.5)" fill="#7FC48E" stroke="#5FA672" stroke-width="1.5"/>
    <ellipse cx="167.5" cy="197.5" rx="17.5" ry="35.0" transform="rotate(12 167.5 197.5)" fill="#7FC48E" stroke="#5FA672" stroke-width="1.5"/>
    <ellipse cx="155.0" cy="217.5" rx="25.0" ry="22.5" transform="rotate(0 155.0 217.5)" fill="#7FC48E" stroke="#5FA672" stroke-width="1.5"/>
    <path d="M150 254 C146 272 140 290 136 304 M160 254 C164 272 170 290 174 304" fill="none" stroke="#C9A96E" stroke-width="3"/>
    <circle cx="220" cy="296" r="4" fill="#FFFFFF"/><circle cx="230" cy="280" r="5" fill="#FFFFFF"/><circle cx="222" cy="266" r="4" fill="#FFFFFF"/>
    <text x="300" y="222" font-size="22" font-weight="800" fill="#0E1A14">Raft over aerated</text>
    <text x="300" y="252" font-size="22" font-weight="800" fill="#0E1A14">solution</text>
    <text x="300" y="286" font-size="20" fill="#3F5248">dissolved oxygen 6–8 ppm</text>
    <rect x="20" y="346" width="290" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="42" y="382" font-size="20" font-weight="800" fill="#5B6F64">Solution pH</text>
    <text x="42" y="424" font-size="34" font-weight="800" fill="#0E1A14">5.5–6.0</text>
    <text x="42" y="460" font-size="20" fill="#3F5248">Tap water often</text>
    <text x="42" y="486" font-size="20" fill="#3F5248">starts above 7</text>
    <rect x="330" y="346" width="290" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="352" y="382" font-size="20" font-weight="800" fill="#5B6F64">EC (feed strength)</text>
    <text x="352" y="424" font-size="34" font-weight="800" fill="#0E1A14">~1.5</text>
    <text x="352" y="460" font-size="20" fill="#3F5248">mS/cm</text>
    <text x="352" y="486" font-size="20" fill="#3F5248">seedlings ~1.0</text>
    <rect x="20" y="538" width="290" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="42" y="574" font-size="20" font-weight="800" fill="#5B6F64">Daily light (DLI)</text>
    <text x="42" y="616" font-size="34" font-weight="800" fill="#0E1A14">12–17</text>
    <text x="42" y="652" font-size="20" fill="#3F5248">mol/m²/day</text>
    <text x="42" y="678" font-size="20" fill="#3F5248">200–300 µmol</text>
    <rect x="330" y="538" width="290" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="352" y="574" font-size="20" font-weight="800" fill="#5B6F64">Day / night max</text>
    <text x="352" y="612" font-size="30" font-weight="800" fill="#0E1A14">24 / 18 °C</text>
    <text x="352" y="648" font-size="20" fill="#3F5248">75 / 65 °F</text>
    <text x="352" y="674" font-size="20" fill="#3F5248">heat = bolting</text>
    <rect x="20" y="746" width="600" height="130" rx="16" fill="#0E1A14"/>
    <text x="44" y="786" font-size="22" font-weight="800" fill="#C6F35E">Transplant at 14–21 days</text>
    <text x="44" y="820" font-size="21" fill="#FFFFFF">Harvest 21–35 days after transplanting</text>
    <text x="44" y="852" font-size="21" fill="#FFFFFF">Start with butterhead or looseleaf types</text>
    <text x="20" y="913" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
