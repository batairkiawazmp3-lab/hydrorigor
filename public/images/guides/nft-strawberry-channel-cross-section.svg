<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1130" width="640" height="1130" role="img" aria-labelledby="t d">
  <title id="t">How an NFT strawberry channel works</title>
  <desc id="d">Two labeled views of a nutrient film technique channel for strawberries. Side view: a pump in the tank sends solution to the high end of a sloped channel; a shallow film runs past the roots of four strawberry plants and drains from the low end back to the tank. Purdue recommends a slope of 1 in 100 but notes 1 in 30 and 1 in 40 are used, and Oregon State gives a 2 percent minimum; Purdue gives a flow of about 1 liter per minute per channel with an upper limit of 2. End view: the crown sits above the lid in a net cup, roots hang through moist air and spread on the shallow film at the bottom of the channel. If the pump stops, plants can wilt quickly.</desc>
  <rect width="640" height="1130" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">How an NFT strawberry channel works</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="90" font-size="20" fill="#3F5248">Side view: solution flows downhill past the</text>
    <text x="20" y="116" font-size="20" fill="#3F5248">roots and returns to the tank</text>

    <!-- plants: leaves and berries -->
    <g fill="#2E8B57">
      <ellipse cx="128" cy="190" rx="26" ry="15"/>
      <ellipse cx="156" cy="182" rx="26" ry="15"/>
      <ellipse cx="248" cy="202" rx="26" ry="15"/>
      <ellipse cx="276" cy="194" rx="26" ry="15"/>
      <ellipse cx="368" cy="214" rx="26" ry="15"/>
      <ellipse cx="396" cy="206" rx="26" ry="15"/>
      <ellipse cx="488" cy="226" rx="26" ry="15"/>
      <ellipse cx="516" cy="218" rx="26" ry="15"/>
    </g>
    <g fill="#D7263D">
      <circle cx="120" cy="226" r="8"/>
      <circle cx="240" cy="238" r="8"/>
      <circle cx="360" cy="250" r="8"/>
      <circle cx="480" cy="262" r="8"/>
    </g>
    <!-- crowns -->
    <g fill="#8A5A2B">
      <rect x="132" y="216" width="16" height="22" rx="4"/>
      <rect x="252" y="228" width="16" height="22" rx="4"/>
      <rect x="372" y="240" width="16" height="22" rx="4"/>
      <rect x="492" y="252" width="16" height="22" rx="4"/>
    </g>

    <!-- channel -->
    <path d="M60 236 L580 286 L580 330 L60 280 Z" fill="#E6F1EA" stroke="#0F6B4F" stroke-width="3"/>
    <path d="M62 272 L578 322" stroke="#3B82C4" stroke-width="7" stroke-linecap="round"/>
    <path d="M300 318 L360 324" stroke="#1F5F99" stroke-width="3"/>
    <path d="M352 316 L366 325 L351 332" fill="none" stroke="#1F5F99" stroke-width="3"/>

    <!-- tank, pump, pipes -->
    <rect x="430" y="420" width="190" height="120" rx="10" fill="#DCEBF7" stroke="#1F5F99" stroke-width="3"/>
    <rect x="430" y="455" width="190" height="85" rx="8" fill="#9CC7EA"/>
    <text x="525" y="445" font-size="20" font-weight="700" fill="#0E1A14" text-anchor="middle">Tank</text>
    <rect x="450" y="495" width="44" height="34" rx="6" fill="#0E1A14"/>
    <text x="510" y="520" font-size="20" fill="#0E1A14">Pump</text>
    <path d="M590 330 L590 420" stroke="#1F5F99" stroke-width="6"/>
    <path d="M472 495 L472 470 L36 470 L36 258 L60 258" fill="none" stroke="#1F5F99" stroke-width="6"/>
    <text x="50" y="230" font-size="20" font-weight="700" fill="#0E1A14">In</text>
    <text x="600" y="380" font-size="20" font-weight="700" fill="#0E1A14" text-anchor="end">Out</text>

    <text x="60" y="370" font-size="21" font-weight="700" fill="#0F6B4F">Slope: 1:100 to 1:30</text>
    <text x="60" y="398" font-size="20" fill="#3F5248">Oregon State: 2% minimum</text>
    <text x="60" y="436" font-size="21" font-weight="700" fill="#0F6B4F">Flow: about 1 L/min</text>
    <text x="60" y="464" font-size="20" fill="#3F5248">per channel, 2 L/min max</text>
    <text x="60" y="510" font-size="20" fill="#3F5248">Pump line to the high end</text>

    <!-- end view -->
    <path d="M20 572 L620 572" stroke="#CFD8D2" stroke-width="2"/>
    <text x="20" y="618" font-size="23" font-weight="800" fill="#0E1A14">End view of one planting hole</text>

    <g fill="#2E8B57">
      <ellipse cx="200" cy="670" rx="44" ry="20"/>
      <ellipse cx="270" cy="660" rx="44" ry="20"/>
      <ellipse cx="240" cy="690" rx="40" ry="18"/>
    </g>
    <circle cx="180" cy="722" r="11" fill="#D7263D"/>
    <rect x="224" y="700" width="32" height="40" rx="6" fill="#8A5A2B"/>
    <!-- lid and net cup -->
    <rect x="110" y="740" width="260" height="14" fill="#0F6B4F"/>
    <path d="M206 740 L274 740 L262 796 L218 796 Z" fill="#FFFFFF" stroke="#3F5248" stroke-width="3"/>
    <!-- channel body -->
    <path d="M110 754 L110 900 L370 900 L370 754" fill="#E6F1EA" stroke="#0F6B4F" stroke-width="4"/>
    <rect x="113" y="876" width="254" height="22" fill="#3B82C4"/>
    <!-- roots -->
    <g stroke="#C9A66B" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M232 796 C226 830 200 860 160 884"/>
      <path d="M240 796 C240 840 236 866 230 886"/>
      <path d="M248 796 C256 836 290 860 330 884"/>
      <path d="M236 800 C214 846 190 874 130 888"/>
      <path d="M244 800 C270 846 300 872 352 888"/>
    </g>

    <g font-size="20" fill="#0E1A14">
      <path d="M262 718 L392 690" stroke="#5B6F64" stroke-width="2"/>
      <text x="398" y="684">Crown above</text>
      <text x="398" y="708">the lid, dry</text>
      <path d="M268 770 L392 770" stroke="#5B6F64" stroke-width="2"/>
      <text x="398" y="777">Net cup</text>
      <path d="M300 830 L392 830" stroke="#5B6F64" stroke-width="2"/>
      <text x="398" y="826">Roots in</text>
      <text x="398" y="850">moist air</text>
      <path d="M366 887 L392 887" stroke="#5B6F64" stroke-width="2"/>
      <text x="398" y="894">Shallow film</text>
    </g>

    <rect x="20" y="936" width="600" height="124" rx="16" fill="#FFF4E5" stroke="#F0C27B" stroke-width="2"/>
    <text x="40" y="976" font-size="23" font-weight="800" fill="#8A4B00">If the pump stops</text>
    <text x="40" y="1008" font-size="20" fill="#0E1A14">roots are not sitting in water, so plants</text>
    <text x="40" y="1036" font-size="20" fill="#0E1A14">can wilt quickly (Oregon State EM 9457)</text>
    <text x="20" y="1100" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
