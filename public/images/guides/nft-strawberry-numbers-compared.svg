<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1150" width="640" height="1150" role="img" aria-labelledby="t d">
  <title id="t">NFT strawberry numbers: what each source says</title>
  <desc id="d">Five cards comparing source figures for an NFT strawberry system, each with HydroRigor's starting choice. Slope: Purdue recommends 1 in 100 but notes 1 in 30 and 1 in 40 are used; Oregon State gives at least 2 percent; start at 2 percent, 1 in 50. Flow per channel: Purdue gives 1 liter per minute with an upper limit of 2; a 2007 HortTechnology paper calls 1 to 2 liters per minute widely recommended; start at 1. Channel length: 9 meters or less (Jones, cited 2007) or 10 to 15 meters or less (Purdue); home channels are far shorter. EC: University of Arizona 1.0 or below, Cornell 1.2, Oklahoma State 1.8 to 2.2; start at 1.0 to 1.2. pH: University of Arizona 5.5 to 6.0, Oklahoma State 6; start at 5.5 to 6.0.</desc>
  <rect width="640" height="1150" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">NFT strawberries: the numbers</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="90" font-size="20" fill="#3F5248">What each source says, and where to start</text>

    <rect x="20" y="118" width="600" height="170" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="158" font-size="23" font-weight="800" fill="#0E1A14">Channel slope</text>
    <text x="40" y="192" font-size="20" fill="#3F5248">Purdue: 1:100 advised; 1:30–1:40 used</text>
    <text x="40" y="222" font-size="20" fill="#3F5248">Oregon State: at least 2%</text>
    <rect x="40" y="238" width="560" height="36" rx="8" fill="#E6F1EA"/>
    <text x="56" y="263" font-size="21" font-weight="800" fill="#0F6B4F">Start at 2% (1 in 50)</text>

    <rect x="20" y="304" width="600" height="170" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="344" font-size="23" font-weight="800" fill="#0E1A14">Flow per channel</text>
    <text x="40" y="378" font-size="20" fill="#3F5248">Purdue: 1 L/min, upper limit 2 L/min</text>
    <text x="40" y="408" font-size="20" fill="#3F5248">HortTechnology 2007: 1–2 L/min</text>
    <rect x="40" y="424" width="560" height="36" rx="8" fill="#E6F1EA"/>
    <text x="56" y="449" font-size="21" font-weight="800" fill="#0F6B4F">Start at 1 L/min</text>

    <rect x="20" y="490" width="600" height="170" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="530" font-size="23" font-weight="800" fill="#0E1A14">Channel length</text>
    <text x="40" y="564" font-size="20" fill="#3F5248">Jones (cited 2007): 9 m or less</text>
    <text x="40" y="594" font-size="20" fill="#3F5248">Purdue: no more than 10–15 m</text>
    <rect x="40" y="610" width="560" height="36" rx="8" fill="#E6F1EA"/>
    <text x="56" y="635" font-size="21" font-weight="800" fill="#0F6B4F">Home channels are far shorter</text>

    <rect x="20" y="676" width="600" height="170" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="716" font-size="23" font-weight="800" fill="#0E1A14">EC (mS/cm)</text>
    <text x="40" y="750" font-size="20" fill="#3F5248">Arizona: 1.0 or below · Cornell: 1.2</text>
    <text x="40" y="780" font-size="20" fill="#3F5248">Oklahoma State: 1.8–2.2</text>
    <rect x="40" y="796" width="560" height="36" rx="8" fill="#E6F1EA"/>
    <text x="56" y="821" font-size="21" font-weight="800" fill="#0F6B4F">Start at 1.0–1.2</text>

    <rect x="20" y="862" width="600" height="170" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="902" font-size="23" font-weight="800" fill="#0E1A14">pH</text>
    <text x="40" y="936" font-size="20" fill="#3F5248">Arizona: 5.5–6.0</text>
    <text x="40" y="966" font-size="20" fill="#3F5248">Oklahoma State: 6</text>
    <rect x="40" y="982" width="560" height="36" rx="8" fill="#E6F1EA"/>
    <text x="56" y="1007" font-size="21" font-weight="800" fill="#0F6B4F">Start at 5.5–6.0</text>

    <text x="20" y="1078" font-size="20" fill="#3F5248">Full sources are listed at the end of the guide</text>
    <text x="20" y="1120" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
