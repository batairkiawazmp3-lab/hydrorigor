    <path d="M134 882 Q130 953 127 1024" fill="none" stroke="#8A6D3B" stroke-width="3"/>
    <path d="M146 882 Q150 953 153 1024" fill="none" stroke="#8A6D3B" stroke-width="3"/>
    <path d="M158 882 Q169 953 180 1024" fill="none" stroke="#8A6D3B" stroke-width="3"/>
    <circle cx="140" cy="799" r="34" fill="#0F6B4F"/>
