    <text x="280" y="822" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0F6B4F">Harvest</text>
    <text x="280" y="862" font-size="21" fill="#0E1A14">4–6 weeks after</text>
    <text x="280" y="892" font-size="21" fill="#0E1A14">transplanting.</text>
    <text x="280" y="922" font-size="21" fill="#0E1A14">Lower roots still</text>
    <text x="280" y="952" font-size="21" fill="#0E1A14">reach the solution.</text>
    <rect x="20" y="1076" width="22" height="6" fill="#C2410C"/>
    <text x="52" y="1086" font-size="20" fill="#3F5248">Air gap</text>
    <rect x="160" y="1068" width="22" height="18" rx="3" fill="#BFE0EC"/>
    <text x="192" y="1086" font-size="20" fill="#3F5248">Nutrient solution</text>
    <text x="20" y="1128" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
