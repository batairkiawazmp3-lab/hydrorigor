<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 952" width="640" height="952" role="img" aria-labelledby="t d">
  <title id="t">Nutrient strength and yield in a University of Nevada, Reno trial</title>
  <desc id="d">Bar chart of mean wet weight per plant in grams. Bok choy: full manufacturer rate 619.1, one-third rate 384.7, organic 239.8. Butterhead lettuce: 150.9, 131.3 and 73.8. Nevada Summer Crisp lettuce: 197.1, 133.1 and 96.2. Full rate was 1,200 ppm and the low rate 400 ppm of the same three-part mineral nutrient; the organic solution yielded least.</desc>
