<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Hydroponic tomato nitrogen and potassium by growth stage</title>
  <desc id="d">Bar chart of the nitrogen and potassium concentrations UF/IFAS recommends in the final nutrient solution for hydroponic tomatoes, in parts per million. Transplant to first cluster: nitrogen 70, potassium 120. First to second cluster: nitrogen 80, potassium 120. Second to third cluster: nitrogen 100, potassium 150. Third to fifth cluster: nitrogen 120, potassium 150. Fifth cluster to the end of the crop: nitrogen 150, potassium 200. Phosphorus stays at 50, calcium at 150, magnesium at 40 to 50 and sulfur at 50 to 60 ppm throughout, and the final solution pH should be 5.8 to 6.2.</desc>
  <rect width="960" height="560" fill="#F5F7F2"/>
  <text x="40" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E1A14">Tomato feeding rises as fruit clusters set</text>
  <text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3F5248">Final nutrient solution, ppm (mg/L), by stage. UF/IFAS HS796 (Hochmuth and Hochmuth)</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="40" y="104" width="16" height="16" rx="3" fill="#0F6B4F"/><text x="64" y="117" font-size="14" fill="#0E1A14">Nitrogen (N)</text>
    <rect x="170" y="104" width="16" height="16" rx="3" fill="#3E6E9B"/><text x="194" y="117" font-size="14" fill="#0E1A14">Potassium (K)</text>
    <line x1="110" y1="395" x2="920" y2="395" stroke="#DCE7E0" stroke-width="1"/>
    <text x="100" y="400" font-size="12" fill="#5B6F64" text-anchor="end">50</text>
    <line x1="110" y1="320" x2="920" y2="320" stroke="#DCE7E0" stroke-width="1"/>
    <text x="100" y="325" font-size="12" fill="#5B6F64" text-anchor="end">100</text>
    <line x1="110" y1="245" x2="920" y2="245" stroke="#DCE7E0" stroke-width="1"/>
    <text x="100" y="250" font-size="12" fill="#5B6F64" text-anchor="end">150</text>
    <line x1="110" y1="170" x2="920" y2="170" stroke="#DCE7E0" stroke-width="1"/>
    <text x="100" y="175" font-size="12" fill="#5B6F64" text-anchor="end">200</text>
    <line x1="110" y1="470" x2="920" y2="470" stroke="#3F5248" stroke-width="2"/>
    <text x="100" y="475" font-size="12" fill="#5B6F64" text-anchor="end">0</text>
    <rect x="142" y="365" width="44" height="105" rx="4" fill="#0F6B4F"/>
    <text x="164" y="357" font-size="15" font-weight="800" fill="#0F6B4F" text-anchor="middle">70</text>
    <rect x="196" y="290" width="44" height="180" rx="4" fill="#3E6E9B"/>
    <text x="218" y="282" font-size="15" font-weight="800" fill="#3E6E9B" text-anchor="middle">120</text>
    <text x="191" y="494" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">Transplant to</text>
    <text x="191" y="512" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">1st cluster</text>
    <rect x="304" y="350" width="44" height="120" rx="4" fill="#0F6B4F"/>
    <text x="326" y="342" font-size="15" font-weight="800" fill="#0F6B4F" text-anchor="middle">80</text>
    <rect x="358" y="290" width="44" height="180" rx="4" fill="#3E6E9B"/>
    <text x="380" y="282" font-size="15" font-weight="800" fill="#3E6E9B" text-anchor="middle">120</text>
    <text x="353" y="494" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">1st to 2nd</text>
    <text x="353" y="512" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">cluster</text>
    <rect x="466" y="320" width="44" height="150" rx="4" fill="#0F6B4F"/>
    <text x="488" y="312" font-size="15" font-weight="800" fill="#0F6B4F" text-anchor="middle">100</text>
    <rect x="520" y="245" width="44" height="225" rx="4" fill="#3E6E9B"/>
    <text x="542" y="237" font-size="15" font-weight="800" fill="#3E6E9B" text-anchor="middle">150</text>
    <text x="515" y="494" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">2nd to 3rd</text>
    <text x="515" y="512" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">cluster</text>
    <rect x="628" y="290" width="44" height="180" rx="4" fill="#0F6B4F"/>
    <text x="650" y="282" font-size="15" font-weight="800" fill="#0F6B4F" text-anchor="middle">120</text>
    <rect x="682" y="245" width="44" height="225" rx="4" fill="#3E6E9B"/>
    <text x="704" y="237" font-size="15" font-weight="800" fill="#3E6E9B" text-anchor="middle">150</text>
    <text x="677" y="494" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">3rd to 5th</text>
    <text x="677" y="512" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">cluster</text>
    <rect x="790" y="245" width="44" height="225" rx="4" fill="#0F6B4F"/>
    <text x="812" y="237" font-size="15" font-weight="800" fill="#0F6B4F" text-anchor="middle">150</text>
    <rect x="844" y="170" width="44" height="300" rx="4" fill="#3E6E9B"/>
    <text x="866" y="162" font-size="15" font-weight="800" fill="#3E6E9B" text-anchor="middle">200</text>
    <text x="839" y="494" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">5th cluster to</text>
    <text x="839" y="512" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">end of crop</text>
  </g>
  <text x="40" y="545" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3F5248">Same at every stage: P 50, Ca 150, Mg 40–50, S 50–60 ppm. Final solution pH 5.8–6.2.</text>
</svg>
