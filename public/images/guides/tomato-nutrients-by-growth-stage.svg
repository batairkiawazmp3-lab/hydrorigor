<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1090" width="640" height="1090" role="img" aria-labelledby="t d">
  <title id="t">Tomato nutrient targets by growth stage</title>
  <desc id="d">Bar chart of the nitrogen and potassium concentrations UF/IFAS recommends in the final nutrient solution for hydroponic tomatoes, in parts per million. Transplant to first cluster: nitrogen 70, potassium 120. First to second cluster: nitrogen 80, potassium 120. Second to third cluster: nitrogen 100, potassium 150. Third to fifth cluster: nitrogen 120, potassium 150. Fifth cluster to the end of the crop: nitrogen 150, potassium 200. Phosphorus stays at 50, calcium at 150, magnesium at 40 to 50 and sulfur at 50 to 60 ppm throughout, and the final solution pH should be 5.8 to 6.2.</desc>
  <rect width="640" height="1090" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Tomato feeding by stage</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Final solution, ppm (mg/L). UF/IFAS HS796</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">(Hochmuth and Hochmuth)</text>
    <rect x="20" y="146" width="22" height="22" rx="4" fill="#0F6B4F"/>
    <text x="52" y="164" font-size="21" font-weight="800" fill="#0E1A14">Nitrogen (N)</text>
    <rect x="230" y="146" width="22" height="22" rx="4" fill="#3E7CB1"/>
    <text x="262" y="164" font-size="21" font-weight="800" fill="#0E1A14">Potassium (K)</text>
    <path d="M24 196 L24 806" stroke="#E1E6E2" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="24" y="834" font-size="20" fill="#3F5248" text-anchor="middle">0</text>
    <path d="M149 196 L149 806" stroke="#E1E6E2" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="149" y="834" font-size="20" fill="#3F5248" text-anchor="middle">50</text>
    <path d="M274 196 L274 806" stroke="#E1E6E2" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="274" y="834" font-size="20" fill="#3F5248" text-anchor="middle">100</text>
    <path d="M399 196 L399 806" stroke="#E1E6E2" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="399" y="834" font-size="20" fill="#3F5248" text-anchor="middle">150</text>
    <path d="M524 196 L524 806" stroke="#E1E6E2" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="524" y="834" font-size="20" fill="#3F5248" text-anchor="middle">200 ppm</text>
    <text x="24" y="232" font-size="21" font-weight="800" fill="#0E1A14">Transplant to 1st cluster</text>
    <rect x="24" y="246" width="175" height="28" rx="4" fill="#0F6B4F"/>
    <text x="209" y="268" font-size="21" font-weight="800" fill="#0F6B4F">70</text>
    <rect x="24" y="282" width="300" height="28" rx="4" fill="#3E7CB1"/>
    <text x="334" y="304" font-size="21" font-weight="800" fill="#3E7CB1">120</text>
    <text x="24" y="350" font-size="21" font-weight="800" fill="#0E1A14">1st to 2nd cluster</text>
    <rect x="24" y="364" width="200" height="28" rx="4" fill="#0F6B4F"/>
    <text x="234" y="386" font-size="21" font-weight="800" fill="#0F6B4F">80</text>
    <rect x="24" y="400" width="300" height="28" rx="4" fill="#3E7CB1"/>
    <text x="334" y="422" font-size="21" font-weight="800" fill="#3E7CB1">120</text>
    <text x="24" y="468" font-size="21" font-weight="800" fill="#0E1A14">2nd to 3rd cluster</text>
    <rect x="24" y="482" width="250" height="28" rx="4" fill="#0F6B4F"/>
    <text x="284" y="504" font-size="21" font-weight="800" fill="#0F6B4F">100</text>
    <rect x="24" y="518" width="375" height="28" rx="4" fill="#3E7CB1"/>
    <text x="409" y="540" font-size="21" font-weight="800" fill="#3E7CB1">150</text>
    <text x="24" y="586" font-size="21" font-weight="800" fill="#0E1A14">3rd to 5th cluster</text>
    <rect x="24" y="600" width="300" height="28" rx="4" fill="#0F6B4F"/>
    <text x="334" y="622" font-size="21" font-weight="800" fill="#0F6B4F">120</text>
    <rect x="24" y="636" width="375" height="28" rx="4" fill="#3E7CB1"/>
    <text x="409" y="658" font-size="21" font-weight="800" fill="#3E7CB1">150</text>
    <text x="24" y="704" font-size="21" font-weight="800" fill="#0E1A14">5th cluster to end of crop</text>
    <rect x="24" y="718" width="375" height="28" rx="4" fill="#0F6B4F"/>
    <text x="409" y="740" font-size="21" font-weight="800" fill="#0F6B4F">150</text>
    <rect x="24" y="754" width="500" height="28" rx="4" fill="#3E7CB1"/>
    <text x="534" y="776" font-size="21" font-weight="800" fill="#3E7CB1">200</text>
    <rect x="20" y="872" width="600" height="160" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="44" y="910" font-size="22" font-weight="800" fill="#0E1A14">Same at every stage, ppm</text>
    <text x="44" y="950" font-size="20" font-weight="800" fill="#5B6F64">P</text>
    <text x="44" y="980" font-size="24" font-weight="800" fill="#0E1A14">50</text>
    <text x="188" y="950" font-size="20" font-weight="800" fill="#5B6F64">Ca</text>
    <text x="188" y="980" font-size="24" font-weight="800" fill="#0E1A14">150</text>
    <text x="332" y="950" font-size="20" font-weight="800" fill="#5B6F64">Mg</text>
    <text x="332" y="980" font-size="24" font-weight="800" fill="#0E1A14">40–50</text>
    <text x="476" y="950" font-size="20" font-weight="800" fill="#5B6F64">S</text>
    <text x="476" y="980" font-size="24" font-weight="800" fill="#0E1A14">50–60</text>
    <text x="44" y="1014" font-size="21" font-weight="800" fill="#0F6B4F">Final solution pH 5.8–6.2</text>
    <text x="20" y="1068" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
