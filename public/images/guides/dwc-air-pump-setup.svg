<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" width="640" height="1000" role="img" aria-labelledby="t d">
  <title id="t">How a DWC air system is laid out</title>
  <desc id="d">Cross-section of a deep water culture tank. The air pump sits outside the tank on a shelf above the water line and plugs into a GFCI outlet. Airline tubing runs from the pump through a check valve, which stops water flowing back to the pump, over the rim and down to an air stone on the tank floor. Bubbles rise through the solution under net cups in an opaque lid. Keep dissolved oxygen at 7 to 10 ppm, never below 4, and the water at 65 to 75 °F.</desc>
  <rect width="640" height="1000" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">A DWC air system</text>
    <text x="20" y="86" font-size="20" fill="#3F5248">Pump outside, stone on the floor</text>
    <rect x="20" y="110" width="600" height="620" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <rect x="40" y="180" width="190" height="14" fill="#8A9A90"/>
    <rect x="70" y="130" width="130" height="50" rx="10" fill="#1F6E8C"/>
    <text x="135" y="163" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Air pump</text>
    <text x="135" y="222" text-anchor="middle" font-size="20" fill="#3F5248">Above water line</text>
    <path d="M200 155 L520 155 L520 300" fill="none" stroke="#0E1A14" stroke-width="5"/>
    <rect x="505" y="200" width="30" height="44" rx="6" fill="#C9A23F"/>
    <text x="492" y="230" text-anchor="end" font-size="21" font-weight="700" fill="#0E1A14">Check valve</text>
    <rect x="80" y="300" width="480" height="20" fill="#2E8B63"/>
    <rect x="150" y="286" width="40" height="44" fill="#FFFFFF" stroke="#2E8B63" stroke-width="3"/>
    <rect x="300" y="286" width="40" height="44" fill="#FFFFFF" stroke="#2E8B63" stroke-width="3"/>
    <rect x="450" y="286" width="40" height="44" fill="#FFFFFF" stroke="#2E8B63" stroke-width="3"/>
    <text x="90" y="276" font-size="20" fill="#3F5248">Opaque lid, net cups</text>
    <rect x="80" y="320" width="480" height="340" fill="#DCEBF1" stroke="#0E1A14" stroke-width="4"/>
    <path d="M170 330 L165 420 M175 330 L182 430 M320 330 L314 440 M325 330 L332 425 M470 330 L465 430 M475 330 L482 420" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M520 300 L520 630" fill="none" stroke="#0E1A14" stroke-width="5"/>
    <rect x="420" y="628" width="120" height="22" rx="11" fill="#3F5248"/>
    <circle cx="440" cy="600" r="7" fill="#FFFFFF" stroke="#1F6E8C" stroke-width="2"/>
    <circle cx="470" cy="570" r="8" fill="#FFFFFF" stroke="#1F6E8C" stroke-width="2"/>
    <circle cx="500" cy="590" r="6" fill="#FFFFFF" stroke="#1F6E8C" stroke-width="2"/>
    <circle cx="455" cy="530" r="8" fill="#FFFFFF" stroke="#1F6E8C" stroke-width="2"/>
    <circle cx="490" cy="500" r="7" fill="#FFFFFF" stroke="#1F6E8C" stroke-width="2"/>
    <text x="110" y="560" font-size="21" font-weight="700" fill="#0E1A14">Air stone on floor</text>
    <text x="110" y="592" font-size="20" fill="#3F5248">Runs 24 hours</text>
    <text x="110" y="480" font-size="21" fill="#0E1A14">Roots in solution</text>
    <text x="320" y="700" text-anchor="middle" font-size="20" fill="#3F5248">Plug into a GFCI outlet</text>
    <rect x="20" y="750" width="600" height="110" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="796" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Oxygen: 7–10 ppm</text>
    <text x="40" y="834" font-size="21" fill="#3F5248">Never below 4 (Virginia Tech)</text>
    <rect x="20" y="870" width="600" height="110" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="916" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Water: 65–75 °F</text>
    <text x="40" y="954" font-size="21" fill="#3F5248">18–24 °C (South Dakota State)</text>
  </g>
</svg>
