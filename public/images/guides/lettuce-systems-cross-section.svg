<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1302" width="640" height="1302" role="img" aria-labelledby="t d">
  <title id="t">Three hydroponic lettuce systems in cross-section: Kratky, deep water culture and NFT</title>
  <desc id="d">Kratky: all solution goes in at the start, about 1 to 1.5 gallons per lettuce plant, and the air gap under the lid grows as the level drops. Deep water culture: a raft floats on aerated solution; keep dissolved oxygen at 7 to 10 ppm with 4 ppm the minimum, at least 12 inches deep and 3 to 4 plants per square foot. NFT: a thin film of solution flows down a sloped channel past bare roots, at a slope of 1:100 to 2 percent and 1 to 2 liters per minute; if the pump stops, roots dry fast.</desc>
  <rect width="640" height="1302" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Three ways to grow lettuce</text>
  <g font-family="Inter, Arial, sans-serif">
