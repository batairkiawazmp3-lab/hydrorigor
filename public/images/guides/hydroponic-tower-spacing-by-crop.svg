<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" width="640" height="1010" role="img" aria-labelledby="t d">
  <title id="t">Plant spacing on a vertical hydroponic tower, by crop</title>
  <desc id="d">Bar chart of the spacing Oklahoma State Extension recommends between plants on a vertical hydroponic tower, in inches: thin leaf lettuce 6 to 8, head lettuce 12, spinach 12, kale 12, strawberry 12, Swiss chard 12 to 14, broccoli 18. Below it, the pump schedules from the same fact sheet: lettuce can run continuously, 24 hours a day; strawberries 7 to 10 times a day for 1 hour each time. Stagger the holes so pots on opposite sides do not touch inside.</desc>
  <rect width="640" height="1010" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Spacing on a tower, by crop</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Inches between plants. Oklahoma State</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">Extension HLA-6724, Table 1</text>
    <path d="M220 148 L220 552" stroke="#CFD8D2" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="220" y="584" font-size="20" fill="#3F5248" text-anchor="middle">0</text>
    <path d="M320 148 L320 552" stroke="#CFD8D2" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="320" y="584" font-size="20" fill="#3F5248" text-anchor="middle">6</text>
    <path d="M420 148 L420 552" stroke="#CFD8D2" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="420" y="584" font-size="20" fill="#3F5248" text-anchor="middle">12</text>
    <path d="M520 148 L520 552" stroke="#CFD8D2" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="520" y="584" font-size="20" fill="#3F5248" text-anchor="middle">18 in</text>
    <text x="20" y="183" font-size="21" fill="#0E1A14">Thin leaf lettuce</text>
    <rect x="220" y="160" width="100.0" height="30" rx="4" fill="#0F6B4F"/>
    <rect x="316.0" y="160" width="37.3" height="30" rx="4" fill="#8CC9A8"/>
    <text x="365.3" y="183" font-size="22" font-weight="800" fill="#0E1A14">6–8</text>
    <text x="20" y="241" font-size="21" fill="#0E1A14">Head lettuce</text>
    <rect x="220" y="218" width="200.0" height="30" rx="4" fill="#0F6B4F"/>
    <text x="432.0" y="241" font-size="22" font-weight="800" fill="#0E1A14">12</text>
    <text x="20" y="299" font-size="21" fill="#0E1A14">Spinach</text>
    <rect x="220" y="276" width="200.0" height="30" rx="4" fill="#0F6B4F"/>
    <text x="432.0" y="299" font-size="22" font-weight="800" fill="#0E1A14">12</text>
    <text x="20" y="357" font-size="21" fill="#0E1A14">Kale</text>
    <rect x="220" y="334" width="200.0" height="30" rx="4" fill="#0F6B4F"/>
    <text x="432.0" y="357" font-size="22" font-weight="800" fill="#0E1A14">12</text>
    <text x="20" y="415" font-size="21" fill="#0E1A14">Strawberry</text>
    <rect x="220" y="392" width="200.0" height="30" rx="4" fill="#0F6B4F"/>
    <text x="432.0" y="415" font-size="22" font-weight="800" fill="#0E1A14">12</text>
    <text x="20" y="473" font-size="21" fill="#0E1A14">Swiss chard</text>
    <rect x="220" y="450" width="200.0" height="30" rx="4" fill="#0F6B4F"/>
    <rect x="416.0" y="450" width="37.3" height="30" rx="4" fill="#8CC9A8"/>
    <text x="465.3" y="473" font-size="22" font-weight="800" fill="#0E1A14">12–14</text>
    <text x="20" y="531" font-size="21" fill="#0E1A14">Broccoli</text>
    <rect x="220" y="508" width="300.0" height="30" rx="4" fill="#0F6B4F"/>
    <text x="532.0" y="531" font-size="22" font-weight="800" fill="#0E1A14">18</text>
    <rect x="20" y="608" width="22" height="18" rx="3" fill="#8CC9A8"/>
    <text x="52" y="624" font-size="20" fill="#3F5248">Pale end = top of the range</text>
    <rect x="20" y="650" width="600" height="160" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="690" font-size="23" font-weight="800" fill="#0E1A14">Pump schedule</text>
    <text x="600" y="690" font-size="20" fill="#5B6F64" text-anchor="end">HLA-6724, step 19</text>
    <text x="40" y="732" font-size="22" font-weight="700" fill="#0E1A14">Lettuce</text>
    <text x="40" y="760" font-size="20" fill="#3F5248">Can run continuously,</text>
    <text x="40" y="786" font-size="20" fill="#3F5248">24 hours a day</text>
    <text x="330" y="732" font-size="22" font-weight="700" fill="#0E1A14">Strawberries</text>
    <text x="330" y="760" font-size="20" fill="#3F5248">7–10 times a day,</text>
    <text x="330" y="786" font-size="20" fill="#3F5248">1 hour each time</text>
    <rect x="20" y="830" width="600" height="104" rx="16" fill="#E6F1EA"/>
    <text x="40" y="868" font-size="22" font-weight="800" fill="#0F6B4F">Stagger the holes</text>
    <text x="40" y="900" font-size="20" fill="#0E1A14">so pots on opposite sides don’t touch inside</text>
    <text x="20" y="985" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
