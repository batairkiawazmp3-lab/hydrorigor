<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Plant spacing on a vertical hydroponic tower, by crop</title>
  <desc id="d">Bar chart of the spacing Oklahoma State Extension recommends between plants on a vertical hydroponic tower, in inches: thin leaf lettuce 6 to 8, head lettuce 12, spinach 12, kale 12, strawberry 12, Swiss chard 12 to 14, broccoli 18. A side panel gives the pump schedules from the same fact sheet: lettuce can be watered continuously, 24 hours a day; strawberries seven to 10 times a day for one hour each.</desc>
  <rect width="960" height="560" fill="#F5F7F2"/>
  <text x="40" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E1A14">How far apart to plant on a tower</text>
  <text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3F5248">Spacing between plants, inches. Oklahoma State Extension HLA-6724, Table 1</text>
  <g font-family="Inter, Arial, sans-serif">
    <line x1="210" y1="112" x2="210" y2="478" stroke="#DCE7E0" stroke-width="1"/>
    <text x="210" y="500" font-size="12" fill="#5B6F64" text-anchor="middle">0 in</text>
    <line x1="354" y1="112" x2="354" y2="478" stroke="#DCE7E0" stroke-width="1"/>
    <text x="354" y="500" font-size="12" fill="#5B6F64" text-anchor="middle">6 in</text>
    <line x1="498" y1="112" x2="498" y2="478" stroke="#DCE7E0" stroke-width="1"/>
    <text x="498" y="500" font-size="12" fill="#5B6F64" text-anchor="middle">12 in</text>
    <line x1="642" y1="112" x2="642" y2="478" stroke="#DCE7E0" stroke-width="1"/>
    <text x="642" y="500" font-size="12" fill="#5B6F64" text-anchor="middle">18 in</text>
    <text x="196" y="148" font-size="15" font-weight="700" fill="#0E1A14" text-anchor="end">Thin leaf lettuce</text>
    <rect x="210" y="130" width="144" height="28" rx="4" fill="#0F6B4F"/>
    <rect x="354" y="130" width="48" height="28" rx="4" fill="#7FC48E"/>
    <text x="412" y="150" font-size="15" font-weight="800" fill="#0E1A14">6–8</text>
    <text x="196" y="198" font-size="15" font-weight="700" fill="#0E1A14" text-anchor="end">Head lettuce</text>
    <rect x="210" y="180" width="288" height="28" rx="4" fill="#0F6B4F"/>
    <text x="508" y="200" font-size="15" font-weight="800" fill="#0E1A14">12</text>
    <text x="196" y="248" font-size="15" font-weight="700" fill="#0E1A14" text-anchor="end">Spinach</text>
    <rect x="210" y="230" width="288" height="28" rx="4" fill="#0F6B4F"/>
    <text x="508" y="250" font-size="15" font-weight="800" fill="#0E1A14">12</text>
    <text x="196" y="298" font-size="15" font-weight="700" fill="#0E1A14" text-anchor="end">Kale</text>
    <rect x="210" y="280" width="288" height="28" rx="4" fill="#0F6B4F"/>
    <text x="508" y="300" font-size="15" font-weight="800" fill="#0E1A14">12</text>
    <text x="196" y="348" font-size="15" font-weight="700" fill="#0E1A14" text-anchor="end">Strawberry</text>
    <rect x="210" y="330" width="288" height="28" rx="4" fill="#0F6B4F"/>
    <text x="508" y="350" font-size="15" font-weight="800" fill="#0E1A14">12</text>
    <text x="196" y="398" font-size="15" font-weight="700" fill="#0E1A14" text-anchor="end">Swiss chard</text>
    <rect x="210" y="380" width="288" height="28" rx="4" fill="#0F6B4F"/>
    <rect x="498" y="380" width="48" height="28" rx="4" fill="#7FC48E"/>
    <text x="556" y="400" font-size="15" font-weight="800" fill="#0E1A14">12–14</text>
    <text x="196" y="448" font-size="15" font-weight="700" fill="#0E1A14" text-anchor="end">Broccoli</text>
    <rect x="210" y="430" width="432" height="28" rx="4" fill="#0F6B4F"/>
    <text x="652" y="450" font-size="15" font-weight="800" fill="#0E1A14">18</text>
    <rect x="700" y="112" width="220" height="250" rx="14" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="720" y="146" font-size="16" font-weight="800" fill="#0E1A14">Pump schedule</text>
    <text x="720" y="180" font-size="14" font-weight="700" fill="#0F6B4F">Lettuce</text>
    <text x="720" y="202" font-size="14" fill="#0E1A14">can run continuously,</text>
    <text x="720" y="222" font-size="14" fill="#0E1A14">24 hours a day</text>
    <text x="720" y="264" font-size="14" font-weight="700" fill="#9A4B2E">Strawberries</text>
    <text x="720" y="286" font-size="14" fill="#0E1A14">7–10 times a day,</text>
    <text x="720" y="306" font-size="14" fill="#0E1A14">1 hour each time</text>
    <text x="720" y="342" font-size="12" fill="#5B6F64">HLA-6724, step 19</text>
    <rect x="700" y="380" width="220" height="98" rx="14" fill="#E3F1E8"/>
    <text x="720" y="410" font-size="14" font-weight="700" fill="#0E1A14">Stagger the holes</text>
    <text x="720" y="432" font-size="13" fill="#0E1A14">so pots on opposite sides</text>
    <text x="720" y="452" font-size="13" fill="#0E1A14">do not touch inside</text>
  </g>
  <text x="40" y="540" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5B6F64">HydroRigor · hydrorigor.com/systems/hydroponic-tower-garden/</text>
</svg>
