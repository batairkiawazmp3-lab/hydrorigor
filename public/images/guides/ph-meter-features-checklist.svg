<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" width="640" height="1010" role="img" aria-labelledby="t d">
  <title id="t">What to look for in a pH meter for hydroponics</title>
  <desc id="d">Checklist. Two-point calibration with pH 4 and pH 7 buffers. Automatic calibration, which Purdue calls desirable. Automatic temperature compensation, because pH changes with temperature. A storage cap that keeps the probe wet in storage solution; a probe that dries out needs a soak of at least an hour before calibrating. Check the listing for a stated accuracy and a replaceable probe. Optional: a combination pen that also reads EC. From Purdue University, Michigan State University Extension and UMass Amherst Extension.</desc>
  <rect width="640" height="1010" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">pH meter checklist</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Features worth paying for</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">(Purdue, Michigan State, UMass)</text>
    <rect x="20" y="160" width="600" height="116" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <circle cx="68" cy="218" r="24" fill="#0F6B4F"/><path d="M56 219 l9 9 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="210" font-size="24" font-weight="800" fill="#0E1A14">Two-point calibration</text>
    <text x="112" y="244" font-size="21" fill="#3F5248">pH 4 and pH 7 buffers</text>
    <rect x="20" y="290" width="600" height="116" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <circle cx="68" cy="348" r="24" fill="#0F6B4F"/><path d="M56 349 l9 9 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="340" font-size="24" font-weight="800" fill="#0E1A14">Automatic calibration</text>
    <text x="112" y="374" font-size="21" fill="#3F5248">Desirable, says Purdue</text>
    <rect x="20" y="420" width="600" height="116" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <circle cx="68" cy="478" r="24" fill="#0F6B4F"/><path d="M56 479 l9 9 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="470" font-size="24" font-weight="800" fill="#0E1A14">Temperature compensation</text>
    <text x="112" y="504" font-size="21" fill="#3F5248">pH changes with temperature</text>
    <rect x="20" y="550" width="600" height="116" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <circle cx="68" cy="608" r="24" fill="#0F6B4F"/><path d="M56 609 l9 9 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="600" font-size="24" font-weight="800" fill="#0E1A14">Cap that keeps the probe wet</text>
    <text x="112" y="634" font-size="21" fill="#3F5248">A dry probe needs a 1-hour soak</text>
    <rect x="20" y="680" width="600" height="116" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <circle cx="68" cy="738" r="24" fill="#0F6B4F"/><path d="M56 739 l9 9 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="730" font-size="24" font-weight="800" fill="#0E1A14">Check the listing</text>
    <text x="112" y="764" font-size="21" fill="#3F5248">Stated accuracy, replaceable probe</text>
    <rect x="20" y="810" width="600" height="116" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <circle cx="68" cy="868" r="22" fill="none" stroke="#0F6B4F" stroke-width="4"/><path d="M68 856 v24 M56 868 h24" stroke="#0F6B4F" stroke-width="5" stroke-linecap="round"/>
    <text x="112" y="860" font-size="24" font-weight="800" fill="#0E1A14">Optional: pH and EC in one</text>
    <text x="112" y="894" font-size="21" fill="#3F5248">A combination pen</text>
    <text x="20" y="988" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
