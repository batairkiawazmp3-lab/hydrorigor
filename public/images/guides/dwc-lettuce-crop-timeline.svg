<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1050" width="640" height="1050" role="img" aria-labelledby="t d">
  <title id="t">A DWC lettuce crop from seed to harvest</title>
  <desc id="d">A timeline for lettuce in deep water culture. Day 0: seed into rockwool or coir cubes; seedlings germinate in about 3 days and get a weak feed of about EC 1.0. Transplant to the raft 14 to 21 days after seeding, at 3 to 4 true leaves. Harvest 21 to 35 days after transplanting. Routine checks: top up the tank every few days as plants drink; check pH every week and keep it at 5.5 to 6.2; replace the solution, fully or partly, every 3 to 4 weeks.</desc>
  <rect width="640" height="1050" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">DWC lettuce, seed to harvest</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Timing: Kentucky CCD-CP-63. pH: Kentucky</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">and University of Illinois Extension</text>
    <path d="M56 190 L56 400" stroke="#9BD1A9" stroke-width="12" stroke-linecap="round"/>
    <path d="M56 400 L56 610" stroke="#8EC3E2" stroke-width="12" stroke-linecap="round"/>
    <circle cx="56" cy="190" r="17" fill="#0E1A14"/><circle cx="56" cy="190" r="7" fill="#C6F35E"/>
    <text x="92" y="198" font-size="24" font-weight="800" fill="#0E1A14">Day 0: seed into cubes</text>
    <text x="92" y="230" font-size="21" fill="#0E1A14">germinates in about 3 days;</text>
    <text x="92" y="258" font-size="21" fill="#0E1A14">weak feed, about EC 1.0</text>
    <circle cx="56" cy="400" r="17" fill="#0E1A14"/><circle cx="56" cy="400" r="7" fill="#C6F35E"/>
    <text x="92" y="408" font-size="24" font-weight="800" fill="#0E1A14">Transplant to the raft</text>
    <text x="92" y="440" font-size="21" fill="#0E1A14">14–21 days after seeding,</text>
    <text x="92" y="468" font-size="21" fill="#0E1A14">at 3–4 true leaves</text>
    <circle cx="56" cy="610" r="17" fill="#0E1A14"/><circle cx="56" cy="610" r="7" fill="#C6F35E"/>
    <text x="92" y="618" font-size="24" font-weight="800" fill="#0E1A14">Harvest</text>
    <text x="92" y="650" font-size="21" fill="#0E1A14">21–35 days after</text>
    <text x="92" y="678" font-size="21" fill="#0E1A14">transplanting</text>
    <rect x="92" y="300" width="214" height="36" rx="18" fill="#DCEFE3"/>
    <text x="199" y="325" font-size="20" font-weight="800" fill="#0F6B4F" text-anchor="middle">Seedlings in cubes</text>
    <rect x="92" y="510" width="140" height="36" rx="18" fill="#E3EEF6"/>
    <text x="162" y="535" font-size="20" font-weight="800" fill="#2D6A8E" text-anchor="middle">On the raft</text>
    <rect x="20" y="718" width="600" height="276" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="44" y="760" font-size="23" font-weight="800" fill="#0E1A14">Routine checks</text>
    <text x="44" y="808" font-size="21" font-weight="800" fill="#0F6B4F">Every few days</text>
    <text x="44" y="836" font-size="21" fill="#0E1A14">top up the tank as plants drink</text>
    <text x="44" y="872" font-size="21" font-weight="800" fill="#0F6B4F">Every week</text>
    <text x="44" y="900" font-size="21" fill="#0E1A14">check pH; keep it at 5.5–6.2</text>
    <text x="44" y="936" font-size="21" font-weight="800" fill="#0F6B4F">Every 3–4 weeks</text>
    <text x="44" y="964" font-size="21" fill="#0E1A14">replace the solution, fully or partly</text>
    <text x="20" y="1028" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
