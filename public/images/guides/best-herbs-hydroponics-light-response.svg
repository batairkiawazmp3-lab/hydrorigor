<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" role="img" aria-labelledby="t d">
  <title id="t">More light, more herb</title>
  <desc id="d">Increase in fresh mass when the daily light integral rose from 7 to 18 moles per square meter per day in an Iowa State NFT trial: dill 241 percent, cilantro 154 percent, parsley 120 percent. EC from 0.5 to 4.0 made no difference.</desc>
  <rect width="640" height="700" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">More light, more herb</text>
    <text x="20" y="88" font-size="20" fill="#3F5248">Fresh mass gain, DLI 7 to DLI 18</text>
    <text x="40" y="160" font-size="22" font-weight="700" fill="#0E1A14">Dill</text>
    <rect x="40" y="174" width="440" height="40" rx="6" fill="#2E8B63"/>
    <text x="494" y="203" font-size="24" font-weight="800" fill="#0E1A14">+241%</text>
    <text x="40" y="270" font-size="22" font-weight="700" fill="#0E1A14">Cilantro</text>
    <rect x="40" y="284" width="281" height="40" rx="6" fill="#2E8B63"/>
    <text x="335" y="313" font-size="24" font-weight="800" fill="#0E1A14">+154%</text>
    <text x="40" y="380" font-size="22" font-weight="700" fill="#0E1A14">Parsley</text>
    <rect x="40" y="394" width="219" height="40" rx="6" fill="#2E8B63"/>
    <text x="273" y="423" font-size="24" font-weight="800" fill="#0E1A14">+120%</text>
    <rect x="20" y="490" width="600" height="180" rx="12" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="40" y="530" font-size="21" font-weight="700" fill="#0E1A14">EC 0.5 to 4.0: no change</text>
    <text x="40" y="566" font-size="20" fill="#3F5248">Same trial, any light level</text>
    <text x="40" y="612" font-size="21" font-weight="700" fill="#0E1A14">Aim for DLI 17 or more</text>
    <text x="40" y="646" font-size="20" fill="#3F5248">About 300 µmol for 16 h</text>
  </g>
</svg>
