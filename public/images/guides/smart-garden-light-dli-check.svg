<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" role="img" aria-labelledby="t d">
  <title id="t">Daily light from a smart garden light by intensity and hours</title>
  <desc id="d">Daily light integral equals PPFD times hours times 0.0036. 150 µmol per square meter per second for 12 hours gives 6.5; 200 for 12 hours gives 8.6; 200 for 16 hours gives 11.5; 210 for 16 hours gives 12.1; 300 for 16 hours gives 17.3. The lettuce target from the University of Kentucky is 12 to 17 mol per square meter per day.</desc>
  <rect width="640" height="900" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Is the light enough?</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="90" font-size="20" fill="#3F5248">DLI = PPFD × hours × 0.0036</text>
    <text x="20" y="118" font-size="20" fill="#3F5248">PPFD in µmol/m²/s at the leaves</text>
    <rect x="352.0" y="170" width="130.0" height="500" fill="#DCEFE3"/>
    <text x="417.0" y="156" font-size="20" font-weight="800" fill="#0F6B4F" text-anchor="middle">Lettuce 12–17</text>
    <text x="40" y="218" font-size="21" font-weight="800" fill="#0E1A14">150 for 12 h</text>
    <rect x="40" y="230" width="169.0" height="36" rx="8" fill="#D1603D"/>
    <text x="219.0" y="258" font-size="21" font-weight="800" fill="#0E1A14">6.5</text>
    <text x="40" y="314" font-size="21" font-weight="800" fill="#0E1A14">200 for 12 h</text>
    <rect x="40" y="326" width="223.6" height="36" rx="8" fill="#E0A23B"/>
    <text x="273.6" y="354" font-size="21" font-weight="800" fill="#0E1A14">8.6</text>
    <text x="40" y="410" font-size="21" font-weight="800" fill="#0E1A14">200 for 16 h</text>
    <rect x="40" y="422" width="299.0" height="36" rx="8" fill="#E0A23B"/>
    <text x="349.0" y="450" font-size="21" font-weight="800" fill="#0E1A14">11.5</text>
    <text x="40" y="506" font-size="21" font-weight="800" fill="#0E1A14">210 for 16 h</text>
    <rect x="40" y="518" width="314.6" height="36" rx="8" fill="#2E8B57"/>
    <text x="364.6" y="546" font-size="21" font-weight="800" fill="#0E1A14">12.1</text>
    <text x="40" y="602" font-size="21" font-weight="800" fill="#0E1A14">300 for 16 h</text>
    <rect x="40" y="614" width="449.8" height="36" rx="8" fill="#2E8B57"/>
    <text x="499.8" y="642" font-size="21" font-weight="800" fill="#0E1A14">17.3</text>
    <text x="20" y="740" font-size="20" fill="#3F5248">Bars show DLI in mol/m²/day</text>
    <text x="20" y="770" font-size="20" fill="#3F5248">(Singapore Food Agency, UF/IFAS, Kentucky)</text>
    <text x="20" y="840" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
