<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" width="640" height="1010" role="img" aria-labelledby="t d">
  <title id="t">Six steps for a tray of hydroponic microgreens</title>
  <desc id="d">Step 1: soak large seed, pea 6 hours and sunflower 12 hours. Step 2: sow 10 to 15 grams of small seed on a wet mat. Step 3: cover for 2 to 5 days under a weighted tray. Step 4: light 16 to 18 hours a day. Step 5: bottom-water, with solution at EC 1.0 and pH 5.5 to 6.0 if feeding. Step 6: harvest at 2 to 3 inches, 7 to 21 days after sowing.</desc>
  <rect width="640" height="1010" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">One tray, six steps</text>
    <text x="20" y="86" font-size="20" fill="#3F5248">Microgreens on a mat, watered from below</text>
    <path d="M80 140 L80 910" stroke="#CFE3D6" stroke-width="6"/>
    <circle cx="80" cy="150" r="30" fill="#1F6E8C"/>
    <text x="80" y="161" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">1</text>
    <text x="130" y="142" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Soak large seed</text>
    <text x="130" y="178" font-size="21" fill="#3F5248">Pea 6 h, sunflower 12 h</text>
    <circle cx="80" cy="300" r="30" fill="#1F6E8C"/>
    <text x="80" y="311" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">2</text>
    <text x="130" y="292" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Sow on a wet mat</text>
    <text x="130" y="328" font-size="21" fill="#3F5248">10–15 g small seed</text>
    <circle cx="80" cy="450" r="30" fill="#1F6E8C"/>
    <text x="80" y="461" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">3</text>
    <text x="130" y="442" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Cover</text>
    <text x="130" y="478" font-size="21" fill="#3F5248">2–5 days, weighted</text>
    <circle cx="80" cy="600" r="30" fill="#2E8B63"/>
    <text x="80" y="611" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">4</text>
    <text x="130" y="592" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Light</text>
    <text x="130" y="628" font-size="21" fill="#3F5248">16–18 h a day</text>
    <circle cx="80" cy="750" r="30" fill="#1F6E8C"/>
    <text x="80" y="761" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">5</text>
    <text x="130" y="742" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Bottom-water</text>
    <text x="130" y="778" font-size="21" fill="#3F5248">EC 1.0, pH 5.5–6.0</text>
    <circle cx="80" cy="900" r="30" fill="#C2533A"/>
    <text x="80" y="911" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">6</text>
    <text x="130" y="892" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Harvest</text>
    <text x="130" y="928" font-size="21" fill="#3F5248">2–3 in, 7–21 days</text>
  </g>
</svg>
