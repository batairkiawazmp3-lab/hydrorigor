<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" width="640" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Hydroponic cucumber timeline from seed to harvest</title>
  <desc id="d">Germinate seedless cucumber seed at 80 to 84 °F; it sprouts in 2 to 3 days. Transplant 2 to 3 weeks after seeding at three or four true leaves. Remove fruit and side shoots on the bottom 24 to 30 inches of the main stem. When the stem reaches the wire, pinch the tip and train two side shoots down. First harvest 50 to 70 days after seeding. Pick three or four times a week over a harvest of about 12 weeks.</desc>
  <rect width="640" height="1000" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Seed to harvest</text>
    <text x="20" y="86" font-size="20" fill="#3F5248">Seedless greenhouse cucumbers</text>
    <path d="M80 140 L80 930" stroke="#CFE3D6" stroke-width="6"/>
    <circle cx="80" cy="150" r="30" fill="#1F6E8C"/>
    <text x="80" y="161" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">1</text>
    <text x="130" y="142" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Germinate</text>
    <text x="130" y="178" font-size="21" fill="#3F5248">80–84 °F (27–29 °C), 2–3 days</text>
    <circle cx="80" cy="300" r="30" fill="#1F6E8C"/>
    <text x="80" y="311" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">2</text>
    <text x="130" y="292" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Transplant</text>
    <text x="130" y="328" font-size="21" fill="#3F5248">2–3 weeks, 3–4 true leaves</text>
    <circle cx="80" cy="450" r="30" fill="#1F6E8C"/>
    <text x="80" y="461" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">3</text>
    <text x="130" y="442" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Lower stem</text>
    <text x="130" y="478" font-size="21" fill="#3F5248">No fruit on bottom 24–30 in</text>
    <circle cx="80" cy="600" r="30" fill="#1F6E8C"/>
    <text x="80" y="611" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">4</text>
    <text x="130" y="592" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">At the wire</text>
    <text x="130" y="628" font-size="21" fill="#3F5248">Pinch tip, two laterals down</text>
    <circle cx="80" cy="750" r="30" fill="#2E8B63"/>
    <text x="80" y="761" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">5</text>
    <text x="130" y="742" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">First harvest</text>
    <text x="130" y="778" font-size="21" fill="#3F5248">50–70 days from seed</text>
    <circle cx="80" cy="900" r="30" fill="#C2533A"/>
    <text x="80" y="911" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">6</text>
    <text x="130" y="892" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0E1A14">Peak picking</text>
    <text x="130" y="928" font-size="21" fill="#3F5248">3–4 times a week, 12 weeks</text>
  </g>
</svg>
