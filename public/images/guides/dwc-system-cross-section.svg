    <rect x="676" y="214" width="10" height="250" fill="#2E3B34"/>
    <rect x="254" y="456" width="432" height="10" fill="#2E3B34"/>
    <path d="M342 260 C340 310 332 350 328 400 M348 260 C350 320 356 360 358 412 M472 260 C470 310 462 350 458 400 M478 260 C480 320 486 360 488 412 M602 260 C600 310 592 350 588 400 M608 260 C610 320 616 360 618 412" fill="none" stroke="#F1E6C8" stroke-width="3"/>
    <rect x="430" y="434" width="80" height="12" rx="6" fill="#5B6F64"/>
    <circle cx="446" cy="420" r="4" fill="#FFFFFF"/><circle cx="462" cy="402" r="5" fill="#FFFFFF"/><circle cx="480" cy="422" r="4" fill="#FFFFFF"/><circle cx="472" cy="380" r="5" fill="#FFFFFF"/><circle cx="456" cy="360" r="4" fill="#FFFFFF"/><circle cx="488" cy="344" r="4" fill="#FFFFFF"/><circle cx="466" cy="318" r="4" fill="#FFFFFF"/>
    <path d="M510 440 L650 440 L650 200 L730 200 L730 320 L780 320" fill="none" stroke="#0E1A14" stroke-width="3"/>
    <rect x="716" y="250" width="28" height="18" rx="4" fill="#D9A441" stroke="#0E1A14" stroke-width="2"/>
    <rect x="780" y="303" width="72" height="34" rx="6" fill="#0E1A14"/>
    <text x="816" y="325" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">AIR PUMP</text>
    <rect x="686" y="432" width="24" height="14" fill="#3F5248"/>
    <rect x="710" y="428" width="12" height="22" rx="3" fill="#D9534F"/>
    <rect x="224" y="466" width="500" height="10" fill="#9DB8A8"/>
    <path d="M240 252 L240 456" stroke="#0E1A14" stroke-width="2"/>
    <path d="M232 252 L248 252 M232 456 L248 456" stroke="#0E1A14" stroke-width="2"/>

    <path d="M272 236 L238 180" stroke="#3F5248" stroke-width="1.5"/>
    <text x="40" y="132" font-size="15" font-weight="700" fill="#0E1A14">Floating raft</text>
    <text x="40" y="152" font-size="13" fill="#3F5248">lettuce at 3–4 plants per sq ft;</text>
    <text x="40" y="170" font-size="13" fill="#3F5248">sized to the tank, no light gaps</text>

    <text x="40" y="262" font-size="15" font-weight="700" fill="#0E1A14">Solution depth</text>
    <text x="40" y="282" font-size="13" fill="#3F5248">at least 12 in for a raft</text>
    <text x="40" y="300" font-size="13" fill="#3F5248">system (Kentucky)</text>

    <text x="40" y="344" font-size="15" font-weight="700" fill="#0E1A14">Opaque, covered sides</text>
    <text x="40" y="364" font-size="13" fill="#3F5248">light in the solution</text>
    <text x="40" y="382" font-size="13" fill="#3F5248">grows algae</text>

    <path d="M430 440 L226 440" stroke="#3F5248" stroke-width="1.5"/>
    <text x="40" y="426" font-size="15" font-weight="700" fill="#0E1A14">Air stone, on all the time</text>
    <text x="40" y="446" font-size="13" fill="#3F5248">7–10 ppm dissolved oxygen;</text>
    <text x="40" y="464" font-size="13" fill="#3F5248">4 ppm is the minimum</text>

    <rect x="300" y="290" width="340" height="96" rx="10" fill="#FFFFFF" stroke="#3F5248" stroke-width="1.5"/>
    <text x="470" y="316" font-size="15" font-weight="700" fill="#0E1A14" text-anchor="middle">Keep the solution at</text>
    <text x="470" y="340" font-size="14" fill="#0E1A14" text-anchor="middle">65–80 °F  ·  pH 5.5–6.2</text>
    <text x="470" y="364" font-size="14" fill="#0E1A14" text-anchor="middle">EC 1.2–1.8 mS/cm for lettuce</text>

    <path d="M744 258 L770 236" stroke="#3F5248" stroke-width="1.5"/>
    <text x="774" y="214" font-size="15" font-weight="700" fill="#0E1A14">Check valve</text>
    <text x="774" y="234" font-size="13" fill="#3F5248">stops back-flow</text>

    <text x="780" y="362" font-size="15" font-weight="700" fill="#0E1A14">Pump outside</text>
    <text x="780" y="380" font-size="13" fill="#3F5248">the tank, above</text>
    <text x="780" y="398" font-size="13" fill="#3F5248">the water line</text>

    <path d="M722 450 L752 500" stroke="#3F5248" stroke-width="1.5"/>
    <text x="756" y="506" font-size="15" font-weight="700" fill="#0E1A14">Drain valve</text>
    <text x="756" y="526" font-size="13" fill="#3F5248">makes emptying easy</text>

    <text x="254" y="510" font-size="15" font-weight="700" fill="#0E1A14">On the floor, level to within 1 inch</text>
    <text x="254" y="530" font-size="13" fill="#3F5248">a full tank is heavy; the water volume also buffers temperature</text>
  </g>
</svg>
