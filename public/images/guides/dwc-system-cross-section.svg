<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Deep water culture system: the parts and the targets</title>
  <desc id="d">A labelled cross-section of a deep water culture raft tank. Lettuce plants sit in a floating raft at 3 to 4 plants per square foot, with the raft matched to the tank so no light reaches the solution. The opaque tank holds solution at least 12 inches deep, kept at 65 to 80 degrees Fahrenheit, pH 5.5 to 6.2 and EC 1.2 to 1.8 for lettuce. An air stone on the bottom runs all the time to keep dissolved oxygen at 7 to 10 ppm, with 4 ppm as the minimum; the air pump sits outside the tank with a check valve in the line. A drain valve sits near the bottom and the tank stands on a floor level to within one inch.</desc>
  <rect width="960" height="600" fill="#F5F7F2"/>
  <text x="40" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E1A14">How a deep water culture tank works</text>
  <text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3F5248">Targets from Virginia Tech SPES-466, UF/IFAS HS1422, University of Kentucky CCD-CP-63 and Oregon State EM 9455</text>

  <g font-family="Inter, Arial, sans-serif">
    <path d="M330 232 C312 200 310 184 320 176 C334 186 340 206 342 228 Z M360 232 C378 200 380 184 370 176 C356 186 350 206 348 228 Z M460 232 C442 200 440 184 450 176 C464 186 470 206 472 228 Z M490 232 C508 200 510 184 500 176 C486 186 480 206 478 228 Z M590 232 C572 200 570 184 580 176 C594 186 600 206 602 228 Z M620 232 C638 200 640 184 630 176 C616 186 610 206 608 228 Z" fill="#7FC48E"/>
