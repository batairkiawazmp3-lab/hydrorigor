<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1225" width="640" height="1225" role="img" aria-labelledby="t d">
  <title id="t">Deep water culture system: the parts and the targets</title>
  <desc id="d">A labelled cross-section of a deep water culture raft tank. Keep the solution at 65 to 80 degrees Fahrenheit, pH 5.5 to 6.2 and EC 1.2 to 1.8 mS/cm for lettuce. 1: lettuce sits in a floating raft at 3 to 4 plants per square foot, with the raft sized to the tank so no light gets in. 2: the solution is at least 12 inches deep for a raft system. 3: opaque, covered sides, because light in the solution grows algae. 4: an air stone on the bottom runs all the time to keep dissolved oxygen at 7 to 10 ppm, with 4 ppm as the minimum. 5: the air pump sits outside the tank, above the water line, with a check valve in the line to stop back-flow. 6: a drain valve near the bottom makes emptying easy. 7: the tank stands on the floor, level to within 1 inch; a full tank is heavy and the water buffers temperature.</desc>
  <rect width="640" height="1225" fill="#F5F7F2"/>
