<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" width="640" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Four lettuce trials: aeroponics against water culture</title>
  <desc id="d">Four results that disagree. Texas A and M, 2018: NFT lettuce shoots weighed about twice the aeroponic shoots, but aeroponic roots were larger. University of Georgia, 2025: lettuce did best in deep water culture or NFT, with no fresh-weight difference against aeroponics, while arugula did best in aeroponics. Cornell, 2021: no difference in shoot weight between aeroponics and deep water culture. Texas Tech poster: aeroponic heads 211 grams against 67 grams in deep water culture at week 5, using about twice the water. Two of four favor water culture or find no difference.</desc>
  <rect width="640" height="1000" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Lettuce: four trials</text>
    <text x="20" y="86" font-size="20" fill="#3F5248">Aeroponics vs water culture</text>

    <rect x="20" y="110" width="600" height="200" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <rect x="20" y="110" width="12" height="200" rx="6" fill="#1F6E8C"/>
    <text x="50" y="150" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Texas A&amp;M, 2018</text>
    <text x="50" y="180" font-size="20" fill="#3F5248">Aeroponics vs NFT, 45 days</text>
    <text x="50" y="220" font-size="22" font-weight="700" fill="#1F6E8C">NFT shoots about 2× heavier</text>
    <text x="50" y="254" font-size="20" fill="#0E1A14">Aeroponic roots larger,</text>
    <text x="50" y="282" font-size="20" fill="#0E1A14">root:shoot almost 3×</text>

    <rect x="20" y="330" width="600" height="200" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <rect x="20" y="330" width="12" height="200" rx="6" fill="#1F6E8C"/>
    <text x="50" y="370" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Univ. of Georgia, 2025</text>
    <text x="50" y="400" font-size="20" fill="#3F5248">DWC, NFT, tower, aeroponics</text>
    <text x="50" y="440" font-size="22" font-weight="700" fill="#1F6E8C">Lettuce: DWC or NFT</text>
    <text x="50" y="474" font-size="20" fill="#0E1A14">No fresh-weight gap vs aero</text>
    <text x="50" y="502" font-size="20" fill="#2E8B63">Arugula: best in aeroponics</text>

    <rect x="20" y="550" width="600" height="170" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <rect x="20" y="550" width="12" height="170" rx="6" fill="#9CA3A0"/>
    <text x="50" y="590" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Cornell, 2021</text>
    <text x="50" y="620" font-size="20" fill="#3F5248">Aeroponics vs DWC</text>
    <text x="50" y="662" font-size="22" font-weight="700" fill="#3F5248">No difference</text>
    <text x="50" y="694" font-size="20" fill="#0E1A14">in shoot fresh or dry weight</text>

    <rect x="20" y="740" width="600" height="200" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <rect x="20" y="740" width="12" height="200" rx="6" fill="#2E8B63"/>
    <text x="50" y="780" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0E1A14">Texas Tech poster</text>
    <text x="50" y="810" font-size="20" fill="#3F5248">Aeroponics vs DWC, week 5</text>
    <text x="50" y="850" font-size="22" font-weight="700" fill="#2E8B63">Aero 211 g vs DWC 67 g</text>
    <text x="50" y="884" font-size="20" fill="#0E1A14">But used about 2× the water</text>
    <text x="50" y="912" font-size="20" fill="#3F5248">Poster, not peer reviewed</text>
    <text x="20" y="976" font-size="20" fill="#3F5248">Blue: water culture ahead. Green: aero</text>
  </g>
</svg>
