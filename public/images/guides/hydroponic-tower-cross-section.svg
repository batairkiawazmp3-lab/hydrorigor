<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1110" width="640" height="1110" role="img" aria-labelledby="t d">
  <title id="t">How a vertical hydroponic tower works</title>
  <desc id="d">Labeled cross-section of a DIY vertical hydroponic tower based on Oklahoma State Extension fact sheet HLA-6724. The tower is 5 to 6 feet tall and holds 28 plants. A submersible pump rated at 400 gallons per hour sits in a 45-gallon tank and runs on a timer. A pipe carries nutrient solution to the top of the tower, where about 10 holes spread it, and it trickles down inside the tower past the roots of plants in 3-inch net pots, then drains back into the tank. The net pots are staggered on each side so they do not touch inside. Indoors, lights above the tower are required. Light falls from the top of the tower to the base, so plants near the top get more light and grow bigger, and plants near the base get less light and grow smaller (Touliatos et al. 2016).</desc>
