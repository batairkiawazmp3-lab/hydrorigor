    <text x="740" y="202" font-size="15" font-weight="800" fill="#0E1A14">the base</text>
    <rect x="740" y="220" width="36" height="200" rx="6" fill="#FBEFD0"/>
    <rect x="740" y="220" width="36" height="70" rx="6" fill="#D9A441"/>
    <rect x="740" y="290" width="36" height="60" fill="#E8C878"/>
    <text x="790" y="240" font-size="13" fill="#0E1A14">Top: most light,</text>
    <text x="790" y="258" font-size="13" fill="#0E1A14">biggest plants</text>
    <text x="790" y="396" font-size="13" fill="#0E1A14">Base: less light,</text>
    <text x="790" y="414" font-size="13" fill="#0E1A14">smaller plants</text>
