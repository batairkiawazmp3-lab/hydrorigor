<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">How a vertical hydroponic tower works</title>
  <desc id="d">Labelled cross-section of a DIY vertical hydroponic tower based on Oklahoma State Extension fact sheet HLA-6724. A submersible pump rated at 400 gallons per hour sits in a 45-gallon tank and runs on a timer. Tubing carries nutrient solution to the top of the tower, where about 10 holes spread it, and it trickles down inside the tower past the roots of plants in 3-inch net pots, then drains back into the tank. The net pots are staggered on each side so they do not touch inside. The recommended tower height is 5 to 6 feet, one tower holds 28 plants, and indoors lights must be placed above the tower. Light reaching the plants falls from the top of the tower to the base, so lower plants grow less.</desc>
