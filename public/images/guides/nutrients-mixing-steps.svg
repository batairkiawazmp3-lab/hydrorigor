<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 870" width="640" height="870" role="img" aria-labelledby="t d">
  <title id="t">Mixing order for a two-part hydroponic nutrient</title>
  <desc id="d">Step 1: start with clean water. Step 2: add part A and stir until dissolved. Step 3: add part B and stir. Step 4: check EC first, then adjust pH last. Calcium fertilizers react with phosphate and sulfate fertilizers when concentrates meet (University of Missouri), so never pour concentrate A straight into concentrate B; dilute each in the full volume of water first.</desc>
  <rect width="640" height="870" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Mixing order matters</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Calcium fertilizers react with phosphate and</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">sulfate when concentrates meet (Missouri)</text>
    <rect x="20" y="150" width="130" height="108" rx="14" fill="#E3EEF6"/>
    <path d="M48 176 L122 176 L114 242 L56 242 Z" fill="#FFFFFF" stroke="#3F5248" stroke-width="3"/>
    <path d="M52 200 L118 200 L114 240 L56 240 Z" fill="#8EC3E2"/>
    <circle cx="186" cy="192" r="16" fill="#0F6B4F"/>
    <text x="186" y="199" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="214" y="200" font-size="24" font-weight="800" fill="#0E1A14">Clean water</text>
    <text x="214" y="232" font-size="21" fill="#3F5248">start with the full volume</text>
    <rect x="20" y="278" width="130" height="108" rx="14" fill="#DCEFE3"/>
    <rect x="55" y="296" width="60" height="78" rx="12" fill="#FFFFFF" stroke="#3F5248" stroke-width="3"/>
    <rect x="72" y="286" width="26" height="12" fill="#3F5248"/>
    <text x="85" y="348" font-size="32" font-weight="800" fill="#0E1A14" text-anchor="middle">A</text>
    <circle cx="186" cy="320" r="16" fill="#0F6B4F"/>
    <text x="186" y="327" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="214" y="328" font-size="24" font-weight="800" fill="#0E1A14">Add A, stir</text>
    <text x="214" y="360" font-size="21" fill="#3F5248">until it dissolves</text>
    <rect x="20" y="406" width="130" height="108" rx="14" fill="#E7E3F3"/>
    <rect x="55" y="424" width="60" height="78" rx="12" fill="#FFFFFF" stroke="#3F5248" stroke-width="3"/>
    <rect x="72" y="414" width="26" height="12" fill="#3F5248"/>
    <text x="85" y="476" font-size="32" font-weight="800" fill="#0E1A14" text-anchor="middle">B</text>
    <circle cx="186" cy="448" r="16" fill="#0F6B4F"/>
    <text x="186" y="455" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="214" y="456" font-size="24" font-weight="800" fill="#0E1A14">Add B, stir</text>
    <text x="214" y="488" font-size="21" fill="#3F5248">into the same water</text>
    <rect x="20" y="534" width="130" height="108" rx="14" fill="#E3EEF6"/>
    <rect x="50" y="546" width="70" height="86" rx="10" fill="#0E1A14"/>
    <rect x="58" y="556" width="54" height="32" rx="4" fill="#C6F35E"/>
    <text x="85" y="579" font-size="20" font-weight="800" fill="#0E1A14" text-anchor="middle">EC</text>
    <text x="85" y="618" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">pH</text>
    <circle cx="186" cy="576" r="16" fill="#0F6B4F"/>
    <text x="186" y="583" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="214" y="584" font-size="24" font-weight="800" fill="#0E1A14">Check EC, then pH</text>
    <text x="214" y="616" font-size="21" fill="#3F5248">EC first, pH last</text>
    <rect x="20" y="676" width="600" height="140" rx="16" fill="#0E1A14"/>
    <text x="44" y="714" font-size="22" font-weight="800" fill="#C6F35E">Never pour A straight into B</text>
    <text x="44" y="748" font-size="21" fill="#FFFFFF">Dilute each concentrate in the full</text>
    <text x="44" y="778" font-size="21" fill="#FFFFFF">volume of water first.</text>
    <text x="20" y="848" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
