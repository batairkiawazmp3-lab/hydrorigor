    <text x="360" y="194" font-size="13" fill="#3F5248">Difficulty</text>
    <circle cx="450" cy="190" r="7" fill="#3E6E9B"/><circle cx="470" cy="190" r="7" fill="#3E6E9B"/><circle cx="490" cy="190" r="7" fill="#DCE7E0"/>
