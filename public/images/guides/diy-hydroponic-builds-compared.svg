<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Three DIY hydroponic builds, easiest first</title>
  <desc id="d">Three home builds compared. Build 1, Kratky bucket: easiest; no pump or power; for lettuce and other short-cycle greens; a 5-gallon bucket with three 2-inch net cups and 1 to 1.5 gallons of solution per lettuce plant (UF/IFAS HS1488). Build 2, aerated DWC tote: moderate; an air pump runs all the time; for lettuce, spinach, kale and herbs; a covered tank, a floating foam raft, an air stone and a check valve, with dissolved oxygen at 7 to 10 ppm (University of Illinois Extension, Virginia Tech). Build 3, Dutch buckets: hardest; a pump on a timer; for tomatoes, peppers and cucumbers; perlite-filled buckets fed by two drip stakes each at 0.5 gallons per hour (Oregon State EM 9456, Virginia Tech).</desc>
  <rect width="960" height="560" fill="#F5F7F2"/>
  <text x="40" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E1A14">Three DIY builds, easiest first</text>
  <text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3F5248">Start with build 1; move up when you want more plants or fruiting crops</text>

  <g font-family="Inter, Arial, sans-serif">
