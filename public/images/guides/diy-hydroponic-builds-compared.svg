<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1220" width="640" height="1220" role="img" aria-labelledby="t d">
  <title id="t">Three DIY hydroponic builds compared, easiest first</title>
  <desc id="d">Three home builds compared. Build 1, Kratky bucket: easiest; no power; for lettuce and short-cycle greens; a 5-gallon food-grade bucket and lid, three 2-inch net cups, nutrient solution and a pH test; 1 to 1.5 gallons per lettuce plant with about 1 inch of air at the start (UF/IFAS HS1488). Build 2, aerated DWC tote: moderate; an air pump runs 24/7; for lettuce, spinach, kale and herbs; a tank with covered sides, a floating foam board, an air pump, air stone and check valve; 7 to 10 ppm oxygen, with 4 ppm as the minimum (University of Illinois Extension, Virginia Tech SPES-466). Build 3, Dutch buckets: hardest; a pump on a timer; for tomatoes, peppers and cucumbers; food-grade buckets filled with perlite, a drip line with screened outlets, and a reservoir, pump and timer; 2 drip stakes per bucket at 0.5 gallons per hour each in the Virginia Tech trial (Oregon State EM 9456, Virginia Tech).</desc>
  <rect width="640" height="1220" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Three DIY builds, easiest first</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Start with build 1; move up when you</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">want more plants or fruiting crops</text>
    <rect x="20" y="146" width="600" height="324" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="44" y="188" font-size="25" font-weight="800" fill="#0E1A14">1. Kratky bucket</text>
    <rect x="489" y="164" width="107" height="34" rx="17" fill="#E6F1EA"/>
    <text x="542.5" y="188" font-size="20" font-weight="800" fill="#0F6B4F" text-anchor="middle">Easiest</text>
    <text x="44" y="228" font-size="20" font-weight="800" fill="#5B6F64">Power</text>
    <text x="130" y="228" font-size="21" fill="#0E1A14">None</text>
    <text x="44" y="260" font-size="20" font-weight="800" fill="#5B6F64">Grow</text>
    <text x="130" y="260" font-size="21" fill="#0E1A14">Lettuce, short-cycle greens</text>
    <text x="44" y="292" font-size="20" font-weight="800" fill="#5B6F64">Parts</text>
    <text x="130" y="292" font-size="21" fill="#0E1A14">5-gallon food-grade bucket + lid</text>
    <text x="130" y="320" font-size="21" fill="#0E1A14">Three 2-inch net cups</text>
    <text x="130" y="348" font-size="21" fill="#0E1A14">Nutrient solution, pH test</text>
    <path d="M44 368 L596 368" stroke="#E2E8E4" stroke-width="2"/>
    <text x="44" y="402" font-size="23" font-weight="800" fill="#0F6B4F">1–1.5 gal per lettuce plant</text>
    <text x="44" y="430" font-size="20" fill="#3F5248">about 1 inch of air at the start</text>
    <text x="44" y="456" font-size="20" fill="#5B6F64">UF/IFAS HS1488</text>
    <rect x="20" y="488" width="600" height="324" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="44" y="530" font-size="25" font-weight="800" fill="#0E1A14">2. Aerated DWC tote</text>
    <rect x="478" y="506" width="118" height="34" rx="17" fill="#FBEFD9"/>
    <text x="537.0" y="530" font-size="20" font-weight="800" fill="#8A5A12" text-anchor="middle">Moderate</text>
    <text x="44" y="570" font-size="20" font-weight="800" fill="#5B6F64">Power</text>
    <text x="130" y="570" font-size="21" fill="#0E1A14">Air pump, 24/7</text>
    <text x="44" y="602" font-size="20" font-weight="800" fill="#5B6F64">Grow</text>
    <text x="130" y="602" font-size="21" fill="#0E1A14">Lettuce, spinach, kale, herbs</text>
    <text x="44" y="634" font-size="20" font-weight="800" fill="#5B6F64">Parts</text>
    <text x="130" y="634" font-size="21" fill="#0E1A14">Tank with covered sides</text>
    <text x="130" y="662" font-size="21" fill="#0E1A14">Floating foam board</text>
    <text x="130" y="690" font-size="21" fill="#0E1A14">Air pump, air stone, check valve</text>
    <path d="M44 710 L596 710" stroke="#E2E8E4" stroke-width="2"/>
    <text x="44" y="744" font-size="23" font-weight="800" fill="#0F6B4F">7–10 ppm oxygen</text>
    <text x="44" y="772" font-size="20" fill="#3F5248">4 ppm is the minimum</text>
    <text x="44" y="798" font-size="20" fill="#5B6F64">Illinois Extension; Virginia Tech SPES-466</text>
    <rect x="20" y="830" width="600" height="324" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="44" y="872" font-size="25" font-weight="800" fill="#0E1A14">3. Dutch buckets</text>
    <rect x="489" y="848" width="107" height="34" rx="17" fill="#F6E3DA"/>
    <text x="542.5" y="872" font-size="20" font-weight="800" fill="#A34A2E" text-anchor="middle">Hardest</text>
    <text x="44" y="912" font-size="20" font-weight="800" fill="#5B6F64">Power</text>
    <text x="130" y="912" font-size="21" fill="#0E1A14">Pump on a timer</text>
    <text x="44" y="944" font-size="20" font-weight="800" fill="#5B6F64">Grow</text>
    <text x="130" y="944" font-size="21" fill="#0E1A14">Tomatoes, peppers, cucumbers</text>
    <text x="44" y="976" font-size="20" font-weight="800" fill="#5B6F64">Parts</text>
    <text x="130" y="976" font-size="21" fill="#0E1A14">Food-grade buckets + perlite</text>
    <text x="130" y="1004" font-size="21" fill="#0E1A14">Drip line, screened outlets</text>
    <text x="130" y="1032" font-size="21" fill="#0E1A14">Reservoir, pump, timer</text>
    <path d="M44 1052 L596 1052" stroke="#E2E8E4" stroke-width="2"/>
    <text x="44" y="1086" font-size="23" font-weight="800" fill="#0F6B4F">2 stakes × 0.5 gal/hr</text>
    <text x="44" y="1114" font-size="20" fill="#3F5248">per bucket (Virginia Tech trial)</text>
    <text x="44" y="1140" font-size="20" fill="#5B6F64">Oregon State EM 9456; Virginia Tech</text>
    <text x="20" y="1198" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
