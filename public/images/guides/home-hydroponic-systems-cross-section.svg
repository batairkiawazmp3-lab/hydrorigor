    <circle cx="455" cy="372" r="5" fill="#FFFFFF"/><circle cx="470" cy="354" r="6" fill="#FFFFFF"/><circle cx="460" cy="334" r="5" fill="#FFFFFF"/><circle cx="474" cy="312" r="6" fill="#FFFFFF"/><circle cx="463" cy="290" r="5" fill="#FFFFFF"/>
    <rect x="536" y="174" width="70" height="34" rx="6" fill="#0E1A14"/>
