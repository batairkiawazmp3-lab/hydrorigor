    <path d="M780 296 L870 296 L862 380 L788 380 Z" fill="#E9E2D4" stroke="#3F5248" stroke-width="3"/>
    <circle cx="800" cy="320" r="3" fill="#C9B79A"/><circle cx="818" cy="336" r="3" fill="#C9B79A"/><circle cx="840" cy="318" r="3" fill="#C9B79A"/><circle cx="852" cy="344" r="3" fill="#C9B79A"/><circle cx="808" cy="358" r="3" fill="#C9B79A"/><circle cx="836" cy="362" r="3" fill="#C9B79A"/>
    <path d="M760 286 L800 286 L800 300 M760 286 L850 286 L850 300" fill="none" stroke="#0E1A14" stroke-width="2"/>
    <text x="756" y="278" font-size="11" fill="#3F5248">drip</text>
    <path d="M825 380 L825 392 L900 392" fill="none" stroke="#3F5248" stroke-width="3"/>
    <text x="825" y="414" font-size="14" font-weight="700" fill="#0E1A14" text-anchor="middle">Media + drip, drains back</text>
    <text x="825" y="436" font-size="13" fill="#0E1A14" text-anchor="middle">2 stakes × 0.5 gal/hour</text>
    <text x="825" y="456" font-size="13" fill="#3F5248" text-anchor="middle">Room for big roots and</text>
    <text x="825" y="474" font-size="13" fill="#3F5248" text-anchor="middle">a support stake</text>
  </g>
</svg>
