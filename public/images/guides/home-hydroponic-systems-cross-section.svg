    <text x="95" y="836" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">PUMP</text>
    <path d="M200 829 L130 829 M60 829 L44 829 L44 688" fill="none" stroke="#0E1A14" stroke-width="2.5"/>
    <text x="165" y="905" font-size="22" font-weight="700" fill="#0E1A14" text-anchor="middle">Nonstop thin film</text>
    <text x="165" y="937" font-size="22" fill="#0E1A14" text-anchor="middle">Slope at least 2%</text>
    <text x="165" y="967" font-size="22" fill="#0E1A14" text-anchor="middle">Back up for power cuts</text>

    <!-- Dutch bucket -->
    <rect x="330" y="565" width="290" height="430" rx="16" fill="#FFFFFF" stroke="#E7D3C8" stroke-width="2"/>
