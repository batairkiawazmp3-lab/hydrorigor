<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">Four home hydroponic systems in cross-section</title>
  <desc id="d">Cross-sections of four systems. Kratky bucket: a net cup in the lid, roots in the solution, and an air gap that grows as the plant drinks; no pump or power; 1 to 1.5 gallons per lettuce plant. Deep water culture: plants on a floating raft over a tank, with an air pump feeding an air stone; keep dissolved oxygen at 7 to 10 ppm, with 4 ppm as the minimum. NFT: a sloped channel carrying a thin film of solution back to a reservoir, with a pump that runs nonstop; slope at least 2 percent. Dutch bucket: a bucket of media fed by drip stakes at 0.5 gallons per hour, draining back to a reservoir.</desc>
  <rect width="960" height="520" fill="#F5F7F2"/>
  <text x="30" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E1A14">Four home systems, side by side</text>
  <text x="30" y="80" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3F5248">Figures from UF/IFAS HS1488, Virginia Tech SPES-466 and Oregon State EM 9457</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="30" y="100" width="210" height="390" rx="14" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="135" y="132" font-size="18" font-weight="800" fill="#0E1A14" text-anchor="middle">Kratky bucket</text>
    <path d="M118 196 C100 170 96 158 104 150 C116 158 122 172 126 190 Z M152 196 C170 170 174 158 166 150 C154 158 148 172 144 190 Z M135 192 C128 166 130 150 135 142 C140 150 142 166 135 192 Z" fill="#7FC48E"/>
    <rect x="78" y="200" width="114" height="10" fill="#3F5248"/>
