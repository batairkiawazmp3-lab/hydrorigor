<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1015" width="640" height="1015" role="img" aria-labelledby="t d">
  <title id="t">Four home hydroponic systems in cross-section</title>
  <desc id="d">Cross-sections of four systems. Kratky bucket: a net cup in the lid, roots in the solution, and an air gap that grows as the plant drinks; no pump or power; 1 to 1.5 gallons per lettuce plant. Deep water culture: plants on a floating raft over a tank, with an air pump feeding an air stone; keep dissolved oxygen at 7 to 10 ppm, with 4 ppm as the minimum. NFT: a sloped channel carrying a thin film of solution back to a reservoir, with a pump that runs nonstop; slope at least 2 percent; plan a backup for power cuts. Dutch bucket: a bucket of media fed by two drip stakes at 0.5 gallons per hour each, draining back to the tank.</desc>
  <rect width="640" height="1015" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Four home systems</text>
  <text x="20" y="88" font-family="Inter, Arial, sans-serif" font-size="20" fill="#3F5248">Figures: UF/IFAS, Virginia Tech, Oregon State</text>

  <g font-family="Inter, Arial, sans-serif">
