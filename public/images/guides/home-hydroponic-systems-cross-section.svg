    <text x="475" y="905" font-size="22" font-weight="700" fill="#0E1A14" text-anchor="middle">Media + drip</text>
    <text x="475" y="937" font-size="22" fill="#0E1A14" text-anchor="middle">2 stakes × 0.5 gal/h</text>
    <text x="475" y="967" font-size="22" fill="#0E1A14" text-anchor="middle">Drains back to tank</text>
  </g>
</svg>
