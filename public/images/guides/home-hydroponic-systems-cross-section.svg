    <path d="M571 208 L571 226 L590 226 L590 416 L465 416 L465 398" fill="none" stroke="#0E1A14" stroke-width="2.5"/>
    <text x="475" y="455" font-size="22" font-weight="700" fill="#0E1A14" text-anchor="middle">Air pump + stone</text>
    <text x="475" y="487" font-size="22" fill="#0E1A14" text-anchor="middle">Oxygen 7–10 ppm</text>
    <text x="475" y="517" font-size="22" fill="#0E1A14" text-anchor="middle">4 ppm minimum</text>

