      <rect x="72" y="237" width="156" height="168" fill="none" stroke="#3F5248" stroke-width="3"/>
      <rect x="74" y="300" width="152" height="103" fill="#BFDDF0"/>
      <path d="M143 258 C140 300 131 340 125 385 M150 258 C150 310 151 350 149 395 M157 258 C161 300 169 340 175 380" fill="none" stroke="#C9A96E" stroke-width="3"/>
      <path d="M236 241 L236 298 M231 241 L241 241 M231 298 L241 298" stroke="#3F5248" stroke-width="2"/>
      <text x="246" y="276" font-size="20" fill="#3F5248">air gap</text>
    </g>
    <text x="165" y="455" font-size="22" font-weight="700" fill="#0E1A14" text-anchor="middle">No pump or power</text>
    <text x="165" y="487" font-size="22" fill="#0E1A14" text-anchor="middle">1–1.5 gal per</text>
    <text x="165" y="517" font-size="22" fill="#0E1A14" text-anchor="middle">lettuce plant</text>

    <!-- Deep water culture -->
    <rect x="330" y="115" width="290" height="430" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="475" y="155" font-size="25" font-weight="800" fill="#0E1A14" text-anchor="middle">Deep water culture</text>
    <path d="M408 243 C392 216 390 204 398 196 C410 204 414 218 416 238 Z M432 243 C448 216 450 204 442 196 C430 204 426 218 424 238 Z M498 243 C482 216 480 204 488 196 C500 204 504 218 506 238 Z M522 243 C538 216 540 204 532 196 C520 204 516 218 514 238 Z" fill="#7FC48E"/>
    <rect x="364" y="243" width="190" height="14" fill="#E9E2D4" stroke="#3F5248" stroke-width="2"/>
    <rect x="360" y="257" width="198" height="148" fill="#BFDDF0" stroke="#3F5248" stroke-width="3"/>
    <path d="M420 257 C418 300 412 330 406 370 M510 257 C512 300 518 330 524 370" fill="none" stroke="#C9A96E" stroke-width="3"/>
