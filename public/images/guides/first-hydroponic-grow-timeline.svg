<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" width="640" height="1080" role="img" aria-labelledby="t d">
  <title id="t">A first hydroponic grow: lettuce in a Kratky bucket</title>
  <desc id="d">Timeline. Day 0: sow lettuce in rockwool or similar plugs and keep them near 68 °F (20 °C); seedlings come up in about 3 days (University of Kentucky). Days 14 to 21: transplant three seedlings with 3 to 4 true leaves into a 5-gallon Kratky bucket with three 2-inch net cups, solution at about EC 1.25 and pH 5.5 to 6.0, filled to about 1 inch below the lid (UF/IFAS). Do not top up over the air roots. Harvest about 3 to 4 weeks after transplant (UF/IFAS), or about 6 to 7 weeks from seeding in Kratky's trials.</desc>
  <rect width="640" height="1080" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Your first grow</text>
