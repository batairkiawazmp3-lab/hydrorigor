<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" width="640" height="1010" role="img" aria-labelledby="t d">
  <title id="t">pH ranges for hydroponic vegetables: pH 6.0 fits every crop</title>
  <desc id="d">Bar chart of pH from Oklahoma State HLA-6722 Table 2: basil 5.5 to 6.0, pepper 5.5 to 6.0, strawberry 6.0, tomato 6.0 to 6.5, broccoli 6.0 to 6.8, lettuce 6.0 to 7.0, spinach 6.0 to 7.0. A line at pH 6.0 crosses every range, so a shared tank can run at pH 6.0. The University of Missouri gives pH 5.5 to 6.5 as the rule of thumb for most hydroponic crops.</desc>
  <rect width="640" height="1010" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">pH by vegetable</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">pH 6.0 fits every crop here</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">(Oklahoma State HLA-6722)</text>
    <path d="M190 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="190.0" y="808" font-size="20" fill="#3F5248" text-anchor="middle">5.0</text>
    <path d="M274 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="274.0" y="808" font-size="20" fill="#3F5248" text-anchor="middle">5.5</text>
    <path d="M358 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="358.0" y="808" font-size="20" fill="#3F5248" text-anchor="middle">6.0</text>
    <path d="M442 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="442.0" y="808" font-size="20" fill="#3F5248" text-anchor="middle">6.5</text>
    <path d="M526 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="526.0" y="808" font-size="20" fill="#3F5248" text-anchor="middle">7.0</text>
    <path d="M610 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="610.0" y="808" font-size="20" fill="#3F5248" text-anchor="middle">7.5</text>
    <text x="30" y="240" font-size="22" font-weight="800" fill="#0E1A14">Basil</text>
    <rect x="274" y="216" width="84" height="36" rx="10" fill="#7FB069"/>
    <text x="30" y="322" font-size="22" font-weight="800" fill="#0E1A14">Pepper</text>
    <rect x="274" y="298" width="84" height="36" rx="10" fill="#7FB069"/>
    <text x="30" y="404" font-size="22" font-weight="800" fill="#0E1A14">Strawberry</text>
    <rect x="350" y="380" width="16" height="36" rx="6" fill="#7FB069"/>
    <text x="30" y="486" font-size="22" font-weight="800" fill="#0E1A14">Tomato</text>
    <rect x="358" y="462" width="84" height="36" rx="10" fill="#7FB069"/>
    <text x="30" y="568" font-size="22" font-weight="800" fill="#0E1A14">Broccoli</text>
    <rect x="358" y="544" width="134" height="36" rx="10" fill="#7FB069"/>
    <text x="30" y="650" font-size="22" font-weight="800" fill="#0E1A14">Lettuce</text>
    <rect x="358" y="626" width="168" height="36" rx="10" fill="#7FB069"/>
    <text x="30" y="732" font-size="22" font-weight="800" fill="#0E1A14">Spinach</text>
    <rect x="358" y="708" width="168" height="36" rx="10" fill="#7FB069"/>
    <path d="M358 176 V782" stroke="#0F6B4F" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="358.0" y="168" font-size="21" font-weight="800" fill="#0F6B4F" text-anchor="middle">pH 6.0</text>
    <text x="400" y="844" font-size="21" font-weight="800" fill="#3F5248" text-anchor="middle">pH</text>
    <rect x="20" y="874" width="600" height="56" rx="14" fill="#E3EEF6"/>
    <text x="44" y="910" font-size="21" font-weight="800" fill="#0E1A14">Missouri: pH 5.5–6.5 for most crops</text>
