    <text x="400" y="1172" font-size="21" font-weight="800" fill="#3F5248" text-anchor="middle">pH</text>
    <rect x="30" y="1192" width="26" height="26" rx="6" fill="#7FB069"/>
    <text x="68" y="1212" font-size="21" fill="#3F5248">Includes pH 6.0</text>
    <rect x="30" y="1230" width="26" height="26" rx="6" fill="#E0A23B"/>
    <text x="68" y="1250" font-size="21" fill="#3F5248">Needs its own pH</text>
