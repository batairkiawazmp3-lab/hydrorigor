<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1070" width="640" height="1070" role="img" aria-labelledby="t d">
  <title id="t">EC ranges for hydroponic vegetables, from Oklahoma State</title>
  <desc id="d">Bar chart of EC in mS/cm from Oklahoma State HLA-6722 Table 2. Low group: pepper 0.8 to 1.8, basil 1.0 to 1.6, lettuce 1.2 to 1.8. Middle group: spinach 1.8 to 2.3, strawberry 1.8 to 2.2. High group: tomato 2.0 to 4.0, broccoli 2.8 to 3.5. Crops in the same group can share a tank. The University of Tennessee runs fruiting crops, peppers included, at 2.0 to 3.0, higher than this table gives for pepper.</desc>
  <rect width="640" height="1070" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">EC by vegetable</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">mS/cm, three groups</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">(Oklahoma State HLA-6722)</text>
    <path d="M250 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="250.0" y="808" font-size="21" fill="#3F5248" text-anchor="middle">1</text>
    <path d="M370 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="370.0" y="808" font-size="21" fill="#3F5248" text-anchor="middle">2</text>
    <path d="M490 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="490.0" y="808" font-size="21" fill="#3F5248" text-anchor="middle">3</text>
    <path d="M610 190 V774" stroke="#DCE7E0" stroke-width="2"/>
    <text x="610.0" y="808" font-size="21" fill="#3F5248" text-anchor="middle">4</text>
    <text x="400" y="844" font-size="21" font-weight="800" fill="#3F5248" text-anchor="middle">EC (mS/cm)</text>
    <text x="30" y="240" font-size="22" font-weight="800" fill="#0E1A14">Pepper</text>
    <rect x="226" y="216" width="120" height="36" rx="10" fill="#7FB069"/>
    <text x="354.0" y="242" font-size="20" font-weight="800" fill="#0E1A14" text-anchor="start">0.8–1.8</text>
    <text x="30" y="322" font-size="22" font-weight="800" fill="#0E1A14">Basil</text>
    <rect x="250" y="298" width="72" height="36" rx="10" fill="#7FB069"/>
    <text x="330.0" y="324" font-size="20" font-weight="800" fill="#0E1A14" text-anchor="start">1.0–1.6</text>
    <text x="30" y="404" font-size="22" font-weight="800" fill="#0E1A14">Lettuce</text>
    <rect x="274" y="380" width="72" height="36" rx="10" fill="#7FB069"/>
    <text x="354.0" y="406" font-size="20" font-weight="800" fill="#0E1A14" text-anchor="start">1.2–1.8</text>
    <text x="30" y="486" font-size="22" font-weight="800" fill="#0E1A14">Spinach</text>
    <rect x="346" y="462" width="60" height="36" rx="10" fill="#E0A23B"/>
    <text x="414.0" y="488" font-size="20" font-weight="800" fill="#0E1A14" text-anchor="start">1.8–2.3</text>
    <text x="30" y="568" font-size="22" font-weight="800" fill="#0E1A14">Strawberry</text>
    <rect x="346" y="544" width="48" height="36" rx="10" fill="#E0A23B"/>
    <text x="402.0" y="570" font-size="20" font-weight="800" fill="#0E1A14" text-anchor="start">1.8–2.2</text>
    <text x="30" y="650" font-size="22" font-weight="800" fill="#0E1A14">Tomato</text>
    <rect x="370" y="626" width="240" height="36" rx="10" fill="#D1603D"/>
    <text x="362.0" y="652" font-size="20" font-weight="800" fill="#0E1A14" text-anchor="end">2.0–4.0</text>
    <text x="30" y="732" font-size="22" font-weight="800" fill="#0E1A14">Broccoli</text>
    <rect x="466" y="708" width="84" height="36" rx="10" fill="#D1603D"/>
    <text x="457.99999999999994" y="734" font-size="20" font-weight="800" fill="#0E1A14" text-anchor="end">2.8–3.5</text>
    <rect x="30" y="864" width="26" height="26" rx="6" fill="#7FB069"/>
    <text x="68" y="884" font-size="21" fill="#3F5248">Low: greens, basil</text>
    <rect x="30" y="902" width="26" height="26" rx="6" fill="#E0A23B"/>
    <text x="68" y="922" font-size="21" fill="#3F5248">Middle: spinach, berries</text>
    <rect x="30" y="940" width="26" height="26" rx="6" fill="#D1603D"/>
    <text x="68" y="960" font-size="21" fill="#3F5248">High: tomato, broccoli</text>
    <text x="20" y="1048" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
