<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" role="img" aria-labelledby="t d">
  <title id="t">Tomato yield by substrate in one trial</title>
  <desc id="d">Total tomato yield in tonnes per hectare, Xiong et al. 2017: rockwool 67.5, peat and vermiculite 76.9, coco coir 84.9. Coir yielded 25.8 percent more than rockwool.</desc>
  <rect width="640" height="760" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Tomato yield by medium</text>
    <text x="20" y="86" font-size="20" fill="#3F5248">Tonnes per hectare, one trial</text>
    <line x1="60" y1="640" x2="620" y2="640" stroke="#3F5248" stroke-width="2"/>
    <rect x="90" y="262" width="130" height="378" rx="8" fill="#1F6E8C"/>
    <text x="155" y="246" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">67.5</text>
    <text x="155" y="676" text-anchor="middle" font-size="22" fill="#0E1A14">Rockwool</text>
    <rect x="255" y="209" width="130" height="431" rx="8" fill="#6B8F71"/>
    <text x="320" y="193" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">76.9</text>
    <text x="320" y="676" text-anchor="middle" font-size="22" fill="#0E1A14">Peat mix</text>
    <rect x="420" y="165" width="130" height="475" rx="8" fill="#8A5A2B"/>
    <text x="485" y="149" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">84.9</text>
    <text x="485" y="676" text-anchor="middle" font-size="22" fill="#0E1A14">Coco coir</text>
    <text x="20" y="730" font-size="22" font-weight="700" fill="#2E8B63">Coir: +25.8% vs rockwool</text>
  </g>
</svg>
