<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1205" width="640" height="1205" role="img" aria-labelledby="t d">
  <title id="t">Mixing a tomato nutrient solution from two stocks</title>
  <desc id="d">Two concentrated stock solutions are kept in separate containers: stock A holds the tomato base fertilizer with magnesium sulfate, and stock B holds calcium nitrate. Do not mix A and B as concentrates, because calcium forms solids with sulfate or phosphate. The reservoir is filled with water first and each stock is added separately. The six steps, in order: 1, test the source water for pH, alkalinity and EC before you buy or mix; 2, fill the reservoir with water; 3, add one stock and stir, measuring each part by the label rate; 4, add the other stock and stir; 5, measure EC, aiming for 2.0 to 3.0 mS/cm for fruiting plants; 6, adjust pH last, to 5.8 to 6.2, once EC is where you want it.</desc>
  <rect width="640" height="1205" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Mixing a tomato solution</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Two stocks, never combined. Penn State, Ohio</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">State HYG-1437, Tennessee W 844-C, UF/IFAS</text>
    <path d="M80 168 L80 152 L140 152 L140 168" fill="none" stroke="#3F5248" stroke-width="3"/>
    <rect x="30" y="168" width="160" height="200" rx="18" fill="#DCEFE3" stroke="#3F5248" stroke-width="3"/>
    <text x="110" y="204" font-size="24" font-weight="800" fill="#0E1A14" text-anchor="middle">Stock A</text>
    <text x="110" y="238" font-size="20" fill="#0E1A14" text-anchor="middle">Tomato base</text>
    <text x="110" y="264" font-size="20" fill="#0E1A14" text-anchor="middle">fertilizer +</text>
    <text x="110" y="290" font-size="20" fill="#0E1A14" text-anchor="middle">magnesium</text>
    <text x="110" y="316" font-size="20" fill="#0E1A14" text-anchor="middle">sulfate</text>
    <path d="M300 168 L300 152 L360 152 L360 168" fill="none" stroke="#3F5248" stroke-width="3"/>
    <rect x="250" y="168" width="160" height="200" rx="18" fill="#E3EEF6" stroke="#3F5248" stroke-width="3"/>
    <text x="330" y="204" font-size="24" font-weight="800" fill="#0E1A14" text-anchor="middle">Stock B</text>
    <text x="330" y="238" font-size="20" fill="#0E1A14" text-anchor="middle">Calcium</text>
    <text x="330" y="264" font-size="20" fill="#0E1A14" text-anchor="middle">nitrate</text>
    <circle cx="220" cy="268" r="20" fill="#D9534F"/><path d="M211 259 L229 277 M229 259 L211 277" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="436" y="198" font-size="20" font-weight="800" fill="#A34A2E">Don’t mix A and B</text>
    <text x="436" y="226" font-size="20" fill="#3F5248">as concentrates:</text>
    <text x="436" y="254" font-size="20" fill="#3F5248">calcium + sulfate</text>
    <text x="436" y="282" font-size="20" fill="#3F5248">or phosphate</text>
    <text x="436" y="310" font-size="20" fill="#3F5248">forms solids</text>
    <path d="M110 372 L110 420 M330 372 L330 420" stroke="#0E1A14" stroke-width="3"/>
    <path d="M100 412 L110 428 L120 412 Z M320 412 L330 428 L340 412 Z" fill="#0E1A14"/>
    <rect x="30" y="432" width="590" height="84" rx="12" fill="#BFDDF0" stroke="#3F5248" stroke-width="3"/>
    <text x="54" y="466" font-size="21" font-weight="800" fill="#0E1A14">Reservoir: filled with water first;</text>
    <text x="54" y="496" font-size="21" fill="#0E1A14">add each stock separately</text>
    <rect x="20" y="546" width="600" height="604" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="44" y="588" font-size="23" font-weight="800" fill="#0E1A14">Six steps, in this order</text>
    <circle cx="60" cy="633" r="16" fill="#0F6B4F"/>
    <text x="60" y="640" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="92" y="640" font-size="22" font-weight="800" fill="#0E1A14">Test the source water</text>
    <text x="92" y="670" font-size="20" fill="#3F5248">pH, alkalinity and EC, before you buy or mix</text>
    <circle cx="60" cy="723" r="16" fill="#0F6B4F"/>
    <text x="60" y="730" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="92" y="730" font-size="22" font-weight="800" fill="#0E1A14">Fill the reservoir with water</text>
    <text x="92" y="760" font-size="20" fill="#3F5248">the stocks are diluted into it</text>
    <circle cx="60" cy="813" r="16" fill="#0F6B4F"/>
    <text x="60" y="820" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="92" y="820" font-size="22" font-weight="800" fill="#0E1A14">Add one stock and stir</text>
    <text x="92" y="850" font-size="20" fill="#3F5248">measure each part by the label rate</text>
    <circle cx="60" cy="903" r="16" fill="#0F6B4F"/>
    <text x="60" y="910" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="92" y="910" font-size="22" font-weight="800" fill="#0E1A14">Add the other stock and stir</text>
    <text x="92" y="940" font-size="20" fill="#3F5248">same reservoir, after the first is mixed in</text>
    <circle cx="60" cy="993" r="16" fill="#0F6B4F"/>
    <text x="60" y="1000" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="92" y="1000" font-size="22" font-weight="800" fill="#0E1A14">Measure EC</text>
    <text x="92" y="1030" font-size="20" font-weight="800" fill="#0F6B4F">2.0–3.0 mS/cm for fruiting plants</text>
    <circle cx="60" cy="1083" r="16" fill="#0F6B4F"/>
    <text x="60" y="1090" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="92" y="1090" font-size="22" font-weight="800" fill="#0E1A14">Adjust pH last</text>
    <text x="92" y="1120" font-size="20" font-weight="800" fill="#0F6B4F">to 5.8–6.2, once EC is where you want it</text>
    <text x="20" y="1183" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
