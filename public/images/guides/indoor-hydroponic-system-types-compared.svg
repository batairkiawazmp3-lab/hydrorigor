<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">Six indoor hydroponic system types compared</title>
  <desc id="d">Kratky bucket: power none; best for lettuce and leafy greens; 1–1.5 gal of water per lettuce plant. DWC tub: power air pump, 24 h; best for lettuce, spinach, kale, herbs; 3–4 lettuce per sq ft; 12 in deep. NFT channels: power pump, constant flow; best for lettuce, herbs, leafy greens; 2% slope; roots dry fast if pump stops. Vertical tower: power pump; best for lettuce, greens, herbs, strawberries; 28 plants; light falls toward the base. Ebb and flow: power pump and reliable timer; best for seedlings, herbs, peppers, greens; Flood to about 1 in below media top. Dutch buckets (drip): power pump and timer; best for tomatoes, peppers, cucumbers; perlite media; best tomato and pepper yields.</desc>
  <rect width="960" height="620" fill="#F5F7F2"/>
  <text x="40" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E1A14">Six indoor system types at a glance</text>
  <text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3F5248">UF/IFAS HS1488, Oregon State EM 9455–9458, Kentucky CCD-CP-63, Oklahoma State HLA-6724, Virginia Tech SPES-466</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="30" y="104" width="900" height="38" rx="6" fill="#0E1A14"/>
    <text x="50" y="129" font-size="14" font-weight="700" fill="#FFFFFF">System</text>
    <text x="260" y="129" font-size="14" font-weight="700" fill="#FFFFFF">Power needed</text>
    <text x="460" y="129" font-size="14" font-weight="700" fill="#FFFFFF">Best crops</text>
    <text x="710" y="129" font-size="14" font-weight="700" fill="#FFFFFF">Key number or risk</text>
    <rect x="30" y="150" width="900" height="66" rx="6" fill="#FFFFFF"/>
    <text x="50" y="188" font-size="16" font-weight="700" fill="#0E1A14">Kratky bucket</text>
    <text x="260" y="188" font-size="14" fill="#0E1A14">None</text>
    <text x="460" y="178" font-size="14" fill="#0E1A14">Lettuce and leafy greens</text>
    <text x="710" y="178" font-size="14" fill="#2F5B40">1–1.5 gal of water per</text>
    <text x="710" y="196" font-size="14" fill="#2F5B40">lettuce plant</text>
    <rect x="30" y="222" width="900" height="66" rx="6" fill="#E7F1E7"/>
    <text x="50" y="260" font-size="16" font-weight="700" fill="#0E1A14">DWC tub</text>
    <text x="260" y="260" font-size="14" fill="#0E1A14">Air pump, 24 h</text>
    <text x="460" y="250" font-size="14" fill="#0E1A14">Lettuce, spinach, kale,</text>
    <text x="460" y="268" font-size="14" fill="#0E1A14">herbs</text>
    <text x="710" y="250" font-size="14" fill="#2F5B40">3–4 lettuce per sq ft; 12 in</text>
    <text x="710" y="268" font-size="14" fill="#2F5B40">deep</text>
    <rect x="30" y="294" width="900" height="66" rx="6" fill="#FFFFFF"/>
    <text x="50" y="332" font-size="16" font-weight="700" fill="#0E1A14">NFT channels</text>
    <text x="260" y="332" font-size="14" fill="#0E1A14">Pump, constant flow</text>
    <text x="460" y="322" font-size="14" fill="#0E1A14">Lettuce, herbs, leafy greens</text>
    <text x="710" y="322" font-size="14" fill="#2F5B40">2% slope; roots dry fast if</text>
    <text x="710" y="340" font-size="14" fill="#2F5B40">pump stops</text>
    <rect x="30" y="366" width="900" height="66" rx="6" fill="#E7F1E7"/>
    <text x="50" y="404" font-size="16" font-weight="700" fill="#0E1A14">Vertical tower</text>
    <text x="260" y="404" font-size="14" fill="#0E1A14">Pump</text>
    <text x="460" y="394" font-size="14" fill="#0E1A14">Lettuce, greens, herbs,</text>
    <text x="460" y="412" font-size="14" fill="#0E1A14">strawberries</text>
    <text x="710" y="394" font-size="14" fill="#2F5B40">28 plants; light falls</text>
    <text x="710" y="412" font-size="14" fill="#2F5B40">toward the base</text>
    <rect x="30" y="438" width="900" height="66" rx="6" fill="#FFFFFF"/>
    <text x="50" y="476" font-size="16" font-weight="700" fill="#0E1A14">Ebb and flow</text>
    <text x="260" y="476" font-size="14" fill="#0E1A14">Pump and reliable timer</text>
    <text x="460" y="466" font-size="14" fill="#0E1A14">Seedlings, herbs, peppers,</text>
    <text x="460" y="484" font-size="14" fill="#0E1A14">greens</text>
    <text x="710" y="466" font-size="14" fill="#2F5B40">Flood to about 1 in below</text>
    <text x="710" y="484" font-size="14" fill="#2F5B40">media top</text>
    <rect x="30" y="510" width="900" height="66" rx="6" fill="#E7F1E7"/>
    <text x="50" y="548" font-size="16" font-weight="700" fill="#0E1A14">Dutch buckets (drip)</text>
    <text x="260" y="548" font-size="14" fill="#0E1A14">Pump and timer</text>
    <text x="460" y="538" font-size="14" fill="#0E1A14">Tomatoes, peppers, cucumbers</text>
    <text x="710" y="538" font-size="14" fill="#2F5B40">Perlite media; best tomato</text>
    <text x="710" y="556" font-size="14" fill="#2F5B40">and pepper yields</text>
    <text x="40" y="598" font-size="13" fill="#3F5248">Buying a countertop smart garden? Check which of these root-zone designs it uses before comparing features.</text>
  </g>
</svg>
