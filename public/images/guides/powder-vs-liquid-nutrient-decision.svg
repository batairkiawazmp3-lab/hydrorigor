<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 940" width="640" height="940" role="img" aria-labelledby="t d">
  <title id="t">Powder or liquid hydroponic nutrients: how to choose</title>
  <desc id="d">Choose liquid for one small reservoir, no 0.1 gram scale, and quick dosing in mL. Choose powder for batches of 5 gallons or more, an accurate scale, and more nutrient per package. Either way, add parts one at a time, then check EC and pH.</desc>
  <rect width="640" height="940" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0E1A14">Powder or liquid?</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="90" font-size="20" fill="#3F5248">Same plant response at the same</text>
    <text x="20" y="118" font-size="20" fill="#3F5248">nutrient rate (Mississippi State)</text>
    <rect x="20" y="150" width="600" height="250" rx="20" fill="#FFFFFF" stroke="#3B7FB0" stroke-width="4"/>
    <rect x="20" y="150" width="600" height="64" rx="20" fill="#3B7FB0"/>
    <text x="320" y="193" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Choose liquid if</text>
    <text x="44" y="262" font-size="22" fill="#0E1A14">• One small reservoir</text>
    <text x="44" y="310" font-size="22" fill="#0E1A14">• No scale that reads 0.1 g</text>
    <text x="44" y="358" font-size="22" fill="#0E1A14">• You want to dose in mL</text>
    <rect x="20" y="430" width="600" height="250" rx="20" fill="#FFFFFF" stroke="#E0A23B" stroke-width="4"/>
    <rect x="20" y="430" width="600" height="64" rx="20" fill="#E0A23B"/>
    <text x="320" y="473" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Choose powder if</text>
    <text x="44" y="542" font-size="22" fill="#0E1A14">• Batches of 5 gal or more</text>
    <text x="44" y="590" font-size="22" fill="#0E1A14">• An accurate scale</text>
    <text x="44" y="638" font-size="22" fill="#0E1A14">• More nutrient per package</text>
    <rect x="20" y="710" width="600" height="160" rx="20" fill="#DCEFE3" stroke="#2E8B57" stroke-width="3"/>
    <text x="320" y="758" font-size="24" font-weight="800" fill="#0E1A14" text-anchor="middle">Either way</text>
    <text x="320" y="800" font-size="22" fill="#3F5248" text-anchor="middle">Add parts one at a time</text>
    <text x="320" y="838" font-size="22" fill="#3F5248" text-anchor="middle">Then check EC, then pH</text>
    <text x="20" y="918" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
