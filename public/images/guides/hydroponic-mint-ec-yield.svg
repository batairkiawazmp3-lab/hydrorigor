<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" role="img" aria-labelledby="t d">
  <title id="t">Peppermint leaf yield by nutrient solution EC</title>
  <desc id="d">Leaf fresh weight per plant in a University of Tabriz peppermint trial: EC 0.7, 715 grams; EC 1.4, 864 grams, the highest; EC 2.8, 498 grams; EC 5.6, 396 grams; EC 5.6 with added salt, 548 grams.</desc>
  <rect width="640" height="860" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Peppermint yield by EC</text>
    <text x="20" y="88" font-size="20" fill="#3F5248">Leaf fresh weight per plant (g)</text>
    <text x="20" y="160" font-size="22" font-weight="800" fill="#0E1A14">EC 0.7 mS/cm: 715 g</text>
    <rect x="20" y="176" width="463" height="44" rx="8" fill="#9DBFAE"/>
    <rect x="20" y="246" width="600" height="190" rx="14" fill="#FFFFFF" stroke="#2E8B63" stroke-width="3"/>
    <text x="40" y="290" font-size="22" font-weight="800" fill="#2E8B63">EC 1.4 mS/cm: 864 g</text>
    <rect x="40" y="306" width="560" height="44" rx="8" fill="#2E8B63"/>
    <text x="40" y="392" font-size="20" fill="#3F5248">Highest yield and</text>
    <text x="40" y="420" font-size="20" fill="#3F5248">highest essential oil</text>
    <text x="20" y="490" font-size="22" font-weight="800" fill="#0E1A14">EC 2.8 mS/cm: 498 g</text>
    <rect x="20" y="506" width="323" height="44" rx="8" fill="#9DBFAE"/>
    <text x="20" y="600" font-size="22" font-weight="800" fill="#0E1A14">EC 5.6 mS/cm: 396 g</text>
    <rect x="20" y="616" width="256" height="44" rx="8" fill="#C2533A"/>
    <text x="20" y="710" font-size="22" font-weight="800" fill="#0E1A14">EC 5.6 + salt: 548 g</text>
    <rect x="20" y="726" width="355" height="44" rx="8" fill="#D9A23A"/>
    <text x="20" y="830" font-size="20" fill="#3F5248">Tabatabaie and Nazari 2007</text>
  </g>
</svg>
