<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1520" width="640" height="1520" role="img" aria-labelledby="t d">
  <title id="t">Which home hydroponic system fits your crop</title>
  <desc id="d">A decision chart. Start with the crop. Leafy greens and herbs: a Kratky bucket if you want no pump or power (1 to 1.5 gallons of solution per lettuce plant, UF/IFAS); deep water culture for more plants with room for a heavy tank (air pump, aim for 7 to 10 ppm dissolved oxygen, Virginia Tech); NFT channels for rows or vertical racks (at least a 2 percent slope, pump runs nonstop, Oregon State). Tomatoes, peppers and cucumbers: Dutch buckets on drip (two drip stakes per bucket at 0.5 gallons per hour each; media systems gave the highest tomato and pepper yields and NFT the lowest, Virginia Tech). Seedlings and mixed pots: ebb and flow trays (flood to about 1 inch below the media top, drain and reflood before it dries out; needs a pump on a reliable timer, Oregon State). Rule of thumb: choose the crop first; pumped systems fail fastest in a power cut, and NFT plants can wilt quickly.</desc>
  <rect width="640" height="1520" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Which system fits your crop?</text>
  <text x="20" y="88" font-family="Inter, Arial, sans-serif" font-size="20" fill="#3F5248">UF/IFAS, Virginia Tech, Oregon State Extension</text>

  <g font-family="Inter, Arial, sans-serif">
    <!-- spine and links from the start to each option -->
    <path d="M40 160 L40 1184" stroke="#0F6B4F" stroke-width="4"/>
    <path d="M40 317 L64 317 M40 477 L64 477 M40 637 L64 637 M40 896 L64 896 M40 1184 L64 1184" stroke="#0F6B4F" stroke-width="3"/>
    <circle cx="40" cy="317" r="6" fill="#0F6B4F"/><circle cx="40" cy="477" r="6" fill="#0F6B4F"/><circle cx="40" cy="637" r="6" fill="#0F6B4F"/><circle cx="40" cy="896" r="6" fill="#0F6B4F"/><circle cx="40" cy="1184" r="6" fill="#0F6B4F"/>

    <rect x="20" y="110" width="600" height="50" rx="25" fill="#0E1A14"/>
    <text x="320" y="143" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Start here: what will you grow?</text>

    <!-- Leafy greens and herbs -->
    <rect x="20" y="185" width="600" height="46" rx="12" fill="#DCEFE3"/>
    <text x="40" y="216" font-size="23" font-weight="800" fill="#0F6B4F">Leafy greens and herbs</text>

    <rect x="64" y="243" width="556" height="148" rx="14" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="84" y="273" font-size="20" fill="#3F5248">No pump, no power?</text>
    <text x="84" y="305" font-size="24" font-weight="800" fill="#0E1A14">Kratky bucket</text>
    <text x="84" y="339" font-size="21" fill="#0E1A14">1–1.5 gal of solution per lettuce plant</text>
    <text x="84" y="371" font-size="20" fill="#5B6F64">UF/IFAS HS1488</text>

    <rect x="64" y="403" width="556" height="148" rx="14" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="84" y="433" font-size="20" fill="#3F5248">More plants, room for a heavy tank?</text>
    <text x="84" y="465" font-size="24" font-weight="800" fill="#0E1A14">Deep water culture</text>
    <text x="84" y="499" font-size="21" fill="#0E1A14">Air pump; aim for 7–10 ppm oxygen</text>
    <text x="84" y="531" font-size="20" fill="#5B6F64">Virginia Tech SPES-466</text>

    <rect x="64" y="563" width="556" height="148" rx="14" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="84" y="593" font-size="20" fill="#3F5248">Rows of small plants or a vertical rack?</text>
    <text x="84" y="625" font-size="24" font-weight="800" fill="#0E1A14">NFT channels</text>
    <text x="84" y="659" font-size="21" fill="#0E1A14">At least 2% slope; pump runs nonstop</text>
    <text x="84" y="691" font-size="20" fill="#5B6F64">Oregon State EM 9457</text>

    <!-- Tomatoes, peppers, cucumbers -->
    <rect x="20" y="735" width="600" height="46" rx="12" fill="#F6E3DA"/>
    <text x="40" y="766" font-size="23" font-weight="800" fill="#A34A2E">Tomatoes, peppers, cucumbers</text>

    <rect x="64" y="793" width="556" height="206" rx="14" fill="#FFFFFF" stroke="#E7D3C8" stroke-width="2"/>
    <text x="84" y="823" font-size="20" fill="#3F5248">Big roots, long season</text>
    <text x="84" y="855" font-size="24" font-weight="800" fill="#0E1A14">Dutch buckets on drip</text>
    <text x="84" y="889" font-size="21" fill="#0E1A14">2 drip stakes per bucket, 0.5 gal/h each</text>
    <text x="84" y="923" font-size="20" fill="#3F5248">In the Virginia Tech trial, media systems</text>
    <text x="84" y="951" font-size="20" fill="#3F5248">gave the highest tomato and pepper yields;</text>
    <text x="84" y="979" font-size="20" fill="#3F5248">NFT the lowest (Virginia Tech SPES-466).</text>

    <!-- Seedlings and mixed pots -->
    <rect x="20" y="1023" width="600" height="46" rx="12" fill="#E3EEF6"/>
    <text x="40" y="1054" font-size="23" font-weight="800" fill="#2D6A8E">Seedlings and mixed pots</text>

    <rect x="64" y="1081" width="556" height="206" rx="14" fill="#FFFFFF" stroke="#CFDDE8" stroke-width="2"/>
    <text x="84" y="1111" font-size="20" fill="#3F5248">Trays of pots that you move around</text>
    <text x="84" y="1143" font-size="24" font-weight="800" fill="#0E1A14">Ebb and flow trays</text>
    <text x="84" y="1177" font-size="21" fill="#0E1A14">Flood to about 1 inch below the media top,</text>
    <text x="84" y="1205" font-size="21" fill="#0E1A14">drain, and reflood before it dries out</text>
    <text x="84" y="1239" font-size="20" fill="#3F5248">Needs a pump on a reliable timer.</text>
    <text x="84" y="1267" font-size="20" fill="#5B6F64">Oregon State EM 9458</text>

    <!-- Rule of thumb -->
    <rect x="20" y="1311" width="600" height="150" rx="16" fill="#0E1A14"/>
    <text x="44" y="1349" font-size="22" font-weight="800" fill="#C6F35E">Rule of thumb</text>
    <text x="44" y="1383" font-size="21" fill="#FFFFFF">Choose the crop first; the system follows.</text>
    <text x="44" y="1413" font-size="21" fill="#FFFFFF">Pumped systems fail fastest in a power cut:</text>
    <text x="44" y="1443" font-size="21" fill="#FFFFFF">NFT plants can wilt quickly (Oregon State).</text>

    <text x="20" y="1500" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
