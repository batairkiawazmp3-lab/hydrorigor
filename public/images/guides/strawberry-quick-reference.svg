<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Indoor hydroponic strawberry quick reference</title>
  <desc id="d">A strawberry plant in substrate with its crown just above the media line, beside target cards: pH 5.5 to 6.0, EC about 1.0 dS/m, day 20 to 24 °C, night 10 to 15 °C, light 12 to 20 mol per square metre per day, and hand pollination every one to two days.</desc>
  <rect width="960" height="540" fill="#F5F7F2"/>
  <text x="40" y="58" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E1A14">Hydroponic strawberries: the targets</text>
  <text x="40" y="88" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3F5248">Starting points from University of Arizona CEAC and Cornell research</text>

  <!-- Plant panel -->
  <rect x="40" y="114" width="380" height="390" rx="18" fill="#FFFFFF" stroke="#D6E3DF" stroke-width="2"/>
  <!-- leaves -->
  <path d="M230 270 C 175 230 150 175 172 140 C 205 160 228 210 230 270 Z" fill="#3E9B6A"/>
  <path d="M230 270 C 285 230 310 175 288 140 C 255 160 232 210 230 270 Z" fill="#5C9459"/>
  <path d="M230 268 C 222 210 230 160 230 130 C 238 160 240 210 230 268 Z" fill="#7DB579"/>
  <!-- crown -->
  <ellipse cx="230" cy="282" rx="22" ry="14" fill="#8A6A45"/>
  <!-- pot and media -->
  <path d="M130 300 L 330 300 L 312 470 L 148 470 Z" fill="#E9E2D4" stroke="#B9AE98" stroke-width="2"/>
  <rect x="134" y="296" width="192" height="8" fill="#CFC4AE"/>
  <!-- roots -->
  <path d="M222 296 C 210 340 196 380 184 440 M230 296 C 230 350 232 400 228 452 M238 296 C 252 340 266 380 276 438 M226 300 C 214 330 182 352 166 370 M236 300 C 250 326 282 346 296 362" fill="none" stroke="#F7F3EA" stroke-width="3" stroke-linecap="round"/>
  <!-- drainage -->
  <path d="M206 470 L 206 486 M230 470 L 230 492 M254 470 L 254 486" stroke="#0F6B4F" stroke-width="3" stroke-linecap="round"/>
  <!-- flower and fruit (drawn over pot edge) -->
  <path d="M236 270 C 290 250 340 252 368 276" fill="none" stroke="#3F6E3C" stroke-width="3"/>
  <circle cx="370" cy="280" r="10" fill="#FFFFFF" stroke="#C9B458" stroke-width="3"/>
  <circle cx="370" cy="280" r="4" fill="#E2C341"/>
  <path d="M224 272 C 170 262 120 270 100 300" fill="none" stroke="#3F6E3C" stroke-width="3"/>
  <path d="M84 304 C 84 290 116 290 116 304 C 116 330 100 344 100 344 C 100 344 84 330 84 304 Z" fill="#C8443A"/>
  <path d="M86 302 L 100 293 L 114 302" fill="none" stroke="#3F6E3C" stroke-width="3"/>
  <!-- labels -->
  <path d="M254 282 L 330 232" stroke="#0E1A14" stroke-width="2"/>
  <text x="330" y="208" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">Crown sits</text>
  <text x="330" y="224" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0E1A14" text-anchor="middle">above media</text>
  <text x="62" y="404" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3F5248">≥2 L airy</text>
  <text x="62" y="420" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3F5248">media</text>
  <text x="270" y="496" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0F6B4F">20–40% drains</text>

  <!-- Target cards -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="448" y="114" width="226" height="118" rx="16" fill="#0E1A14"/>
    <text x="468" y="146" font-size="14" fill="#C6F35E">Solution pH</text>
    <text x="468" y="190" font-family="IBM Plex Mono, Consolas, monospace" font-size="34" font-weight="700" fill="#FFFFFF">5.5–6.0</text>
    <text x="468" y="216" font-size="13" fill="#C6F35E">Above 7: iron lockout</text>

    <rect x="694" y="114" width="226" height="118" rx="16" fill="#0F6B4F"/>
    <text x="714" y="146" font-size="14" fill="#E3F1E8">EC (feed strength)</text>
    <text x="714" y="190" font-family="IBM Plex Mono, Consolas, monospace" font-size="34" font-weight="700" fill="#FFFFFF">~1.0</text>
    <text x="714" y="216" font-size="13" fill="#E3F1E8">dS/m · keep ≤ 1.2</text>

    <rect x="448" y="250" width="226" height="118" rx="16" fill="#E3F1E8" stroke="#CFE3D6" stroke-width="2"/>
    <text x="468" y="282" font-size="14" fill="#3F5248">Day / night air</text>
    <text x="468" y="326" font-family="IBM Plex Mono, Consolas, monospace" font-size="23" font-weight="700" fill="#0E1A14">20–24 / 10–15</text>
    <text x="468" y="352" font-size="13" fill="#3F5248">°C · cool nights = sweeter</text>

    <rect x="694" y="250" width="226" height="118" rx="16" fill="#E3F1E8" stroke="#CFE3D6" stroke-width="2"/>
    <text x="714" y="282" font-size="14" fill="#3F5248">Daily light (DLI)</text>
    <text x="714" y="326" font-family="IBM Plex Mono, Consolas, monospace" font-size="30" font-weight="700" fill="#0E1A14">12–20</text>
    <text x="714" y="352" font-size="13" fill="#3F5248">mol/m²/day · 200–250 µmol</text>

    <rect x="448" y="386" width="472" height="118" rx="16" fill="#FFFFFF" stroke="#D6E3DF" stroke-width="2"/>
    <circle cx="492" cy="445" r="20" fill="#3E9B6A"/>
    <path d="M482 445 L 489 452 L 503 437" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="528" y="430" font-size="17" font-weight="700" fill="#0E1A14">Start with day-neutral plants</text>
    <text x="528" y="454" font-size="14" fill="#3F5248">e.g. Albion, San Andreas, Monterey, Seascape</text>
    <text x="528" y="478" font-size="14" fill="#3F5248">Hand-pollinate open flowers every 1–2 days</text>
  </g>
</svg>
