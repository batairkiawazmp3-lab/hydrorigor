<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 975" width="640" height="975" role="img" aria-labelledby="t d">
  <title id="t">Hydroponic strawberry targets at a glance</title>
  <desc id="d">A strawberry plant in substrate with its crown sitting above the media line, in at least 2 liters of airy media with 20 to 40 percent of each watering draining out, beside target cards: solution pH 5.5 to 6.0 (above 7, iron locks out); EC about 1.0 dS/m, kept at or below 1.2; day air 20 to 24 °C (68 to 75 °F) and night 10 to 15 °C (50 to 59 °F), with cool nights making sweeter fruit; daily light 12 to 20 mol per square meter per day, 200 to 250 µmol. Start with day-neutral plants such as Albion, San Andreas, Monterey or Seascape, and hand-pollinate open flowers every 1 to 2 days.</desc>
  <rect width="640" height="975" fill="#F5F7F2"/>
  <text x="20" y="54" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Hydroponic strawberries: targets</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="88" font-size="20" fill="#3F5248">Starting points from University of Arizona</text>
    <text x="20" y="114" font-size="20" fill="#3F5248">CEAC and Cornell research</text>
    <rect x="20" y="150" width="600" height="196" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <path d="M70 254 L240 254 L228 330 L82 330 Z" fill="#E9E2D4" stroke="#3F5248" stroke-width="3"/>
    <circle cx="100" cy="280" r="3.5" fill="#C9B79A"/><circle cx="130" cy="300" r="3.5" fill="#C9B79A"/><circle cx="170" cy="284" r="3.5" fill="#C9B79A"/><circle cx="200" cy="306" r="3.5" fill="#C9B79A"/><circle cx="150" cy="318" r="3.5" fill="#C9B79A"/>
    <path d="M64 254 L246 254" stroke="#8A6A4A" stroke-width="2" stroke-dasharray="6 5"/>
    <ellipse cx="155" cy="246" rx="14" ry="9" fill="#8A6A4A"/>
    <ellipse cx="120" cy="206" rx="20" ry="28" transform="rotate(-40 120 206)" fill="#7FC48E" stroke="#5FA672" stroke-width="1.5"/>
    <ellipse cx="155" cy="192" rx="20" ry="28" transform="rotate(0 155 192)" fill="#7FC48E" stroke="#5FA672" stroke-width="1.5"/>
    <ellipse cx="190" cy="206" rx="20" ry="28" transform="rotate(40 190 206)" fill="#7FC48E" stroke="#5FA672" stroke-width="1.5"/>
    <path d="M190 236 C220 232 254 238 256 256" fill="none" stroke="#5FA672" stroke-width="3"/>
    <g transform="translate(34 6)">
    <path d="M206 266 C204 254 214 250 222 254 C230 250 240 254 238 266 C236 280 226 292 222 294 C218 292 208 280 206 266 Z" fill="#D9534F"/>
    <path d="M212 254 L222 262 L232 254 L226 252 L222 248 L218 252 Z" fill="#5FA672"/>
    <circle cx="216" cy="268" r="1.8" fill="#F6E3A4"/><circle cx="228" cy="268" r="1.8" fill="#F6E3A4"/><circle cx="222" cy="279" r="1.8" fill="#F6E3A4"/>
    </g>
    <text x="300" y="212" font-size="22" font-weight="800" fill="#0E1A14">Crown sits above</text>
    <text x="300" y="240" font-size="22" font-weight="800" fill="#0E1A14">the media line</text>
    <text x="300" y="276" font-size="20" fill="#3F5248">≥2 L of airy media</text>
    <text x="300" y="304" font-size="20" fill="#3F5248">20–40% drains out</text>
    <rect x="20" y="366" width="290" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="42" y="402" font-size="20" font-weight="800" fill="#5B6F64">Solution pH</text>
    <text x="42" y="444" font-size="34" font-weight="800" fill="#0E1A14">5.5–6.0</text>
    <text x="42" y="480" font-size="20" fill="#3F5248">Above 7: iron</text>
    <text x="42" y="506" font-size="20" fill="#3F5248">lockout</text>
    <rect x="330" y="366" width="290" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="352" y="402" font-size="20" font-weight="800" fill="#5B6F64">EC (feed strength)</text>
    <text x="352" y="444" font-size="34" font-weight="800" fill="#0E1A14">~1.0</text>
    <text x="352" y="480" font-size="20" fill="#3F5248">dS/m</text>
    <text x="352" y="506" font-size="20" fill="#3F5248">keep ≤ 1.2</text>
    <rect x="20" y="558" width="290" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="42" y="594" font-size="20" font-weight="800" fill="#5B6F64">Day / night air</text>
    <text x="42" y="630" font-size="28" font-weight="800" fill="#0E1A14">20–24 / 10–15</text>
    <text x="42" y="666" font-size="20" fill="#3F5248">°C · 68–75 / 50–59 °F</text>
    <text x="42" y="692" font-size="20" fill="#3F5248">cool nights = sweeter</text>
    <rect x="330" y="558" width="290" height="176" rx="16" fill="#FFFFFF" stroke="#CFE3D6" stroke-width="2"/>
    <text x="352" y="594" font-size="20" font-weight="800" fill="#5B6F64">Daily light (DLI)</text>
    <text x="352" y="636" font-size="34" font-weight="800" fill="#0E1A14">12–20</text>
    <text x="352" y="672" font-size="20" fill="#3F5248">mol/m²/day</text>
    <text x="352" y="698" font-size="20" fill="#3F5248">200–250 µmol</text>
    <rect x="20" y="766" width="600" height="150" rx="16" fill="#0E1A14"/>
    <text x="44" y="806" font-size="22" font-weight="800" fill="#C6F35E">Start with day-neutral plants</text>
    <text x="44" y="840" font-size="20" fill="#FFFFFF">e.g. Albion, San Andreas, Monterey, Seascape</text>
    <text x="44" y="880" font-size="21" font-weight="800" fill="#FFFFFF">Hand-pollinate open flowers every 1–2 days</text>
    <text x="20" y="953" font-size="20" fill="#5B6F64">HydroRigor · hydrorigor.com</text>
  </g>
</svg>
