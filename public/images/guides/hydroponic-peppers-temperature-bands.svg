<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 980" width="640" height="980" role="img" aria-labelledby="t d">
  <title id="t">Pepper fruit set by temperature</title>
  <desc id="d">Above 90 degrees Fahrenheit (32 Celsius) by day: very little fruit set. Above 85 F (29 C): fruit that sets is small and poorly shaped. 65 to 80 F (18 to 27 C): best yields during fruit set. Nights above 75 F (24 C): blossom drop. Nights below 60 F (16 C): very little fruit set; keep greenhouse nights over 59 F (15 C) and at least 60 to 62 F to reduce fruit cracking.</desc>
  <rect width="640" height="980" fill="#F5F7F2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="20" y="52" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1A14">Pepper fruit set</text>
    <text x="20" y="86" font-size="20" fill="#3F5248">Air temperature bands</text>

    <rect x="20" y="110" width="600" height="150" rx="16" fill="#FBE3DC" stroke="#C2533A" stroke-width="2"/>
    <text x="40" y="158" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#7A2614">Over 90 °F (32 °C) by day</text>
    <text x="40" y="198" font-size="21" fill="#3F5248">Very little fruit sets</text>
    <text x="40" y="232" font-size="21" fill="#3F5248">Over 85 °F (29 °C): small, misshapen</text>

    <rect x="20" y="280" width="600" height="150" rx="16" fill="#FDF0D5" stroke="#C98A1B" stroke-width="2"/>
    <text x="40" y="328" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#6B4A06">Nights over 75 °F (24 °C)</text>
    <text x="40" y="368" font-size="21" fill="#3F5248">Blossoms drop</text>
    <text x="40" y="402" font-size="21" fill="#3F5248">Cool the room at night</text>

    <rect x="20" y="450" width="600" height="190" rx="16" fill="#E3F2E8" stroke="#2E8B63" stroke-width="3"/>
    <text x="40" y="500" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0E4D33">65–80 °F (18–27 °C)</text>
    <text x="40" y="542" font-size="22" font-weight="700" fill="#0E4D33">Best yields during fruit set</text>
    <text x="40" y="580" font-size="21" fill="#3F5248">Garden guide: warm, 70–75 °F</text>
    <text x="40" y="614" font-size="21" fill="#3F5248">(21–24 °C)</text>

    <rect x="20" y="660" width="600" height="150" rx="16" fill="#FDF0D5" stroke="#C98A1B" stroke-width="2"/>
    <text x="40" y="708" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#6B4A06">Nights 59–62 °F (15–17 °C)</text>
    <text x="40" y="748" font-size="21" fill="#3F5248">Lowest nights to aim for</text>
    <text x="40" y="782" font-size="21" fill="#3F5248">Less fruit cracking above 60 °F</text>

    <rect x="20" y="830" width="600" height="130" rx="16" fill="#DCE8F2" stroke="#1F6E8C" stroke-width="2"/>
    <text x="40" y="878" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0D3B4F">Nights under 60 °F (16 °C)</text>
    <text x="40" y="918" font-size="21" fill="#3F5248">Very little fruit sets</text>
  </g>
</svg>
