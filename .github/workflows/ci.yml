name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Astro diagnostics
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Data and tool verification
        run: npm run test:data

      - name: Production build
        run: npm run build

      - name: Static search smoke test
        run: npm run test:search
