name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lighthouse Chrome startup diagnostic
        run: node scripts/run-lighthouse.mjs --startup-only

      - name: Lint
        run: npm run lint

      - name: Astro diagnostics
        run: npm run check

      - name: M08 evidence secret-safety tests
        run: node scripts/test-m08-evidence-safety.mjs

      - name: Unit tests
        run: npm test

      - name: Data and tool verification
        run: npm run test:data

      - name: Commercial integrity verification
        run: npm run test:commerce

      - name: Production content integrity verification
        run: npm run test:content

      - name: Production build
        run: npm run build

      - name: Static search smoke test
        run: npm run test:search

      - name: Built link integrity
        run: npm run test:links

      - name: Security integrity
        run: npm run test:security

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Chromium smoke tests
        run: npm run test:e2e

      - name: WCAG A/AA accessibility tests
        run: npm run test:a11y

      - name: M08 launch smoke local rehearsal
        run: npm run test:launch

      - name: Lighthouse mobile budgets
        run: npm run test:lighthouse

      - name: Preserve local Chrome startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent/tmp/lighthouse-startup/
          if-no-files-found: ignore
          retention-days: 14
