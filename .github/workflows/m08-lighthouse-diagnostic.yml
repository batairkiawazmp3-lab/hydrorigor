name: m08-linux-lighthouse-diagnostic

on:
  push:
    branches: [codex/m08-staged-validation]
    paths:
      - .github/workflows/m08-lighthouse-diagnostic.yml
      - scripts/diagnose-lighthouse.mjs

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PUBLIC_ENABLE_VERCEL_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 50966ce935cb2b7dbdc1ea3b4630b9feb1e9f50d
          path: release
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Verify exact release and install locked dependencies
        working-directory: release
        run: |
          test "$(git rev-parse HEAD)" = 50966ce935cb2b7dbdc1ea3b4630b9feb1e9f50d
          npm ci
      - name: Build locally without analytics
        working-directory: release
        run: npm run build
      - name: Provision exact diagnostic Chrome for Testing
        run: |
          set -euo pipefail
          browser_root="$RUNNER_TEMP/m08-diagnostic-browser"
          mkdir -p "$browser_root"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chrome-linux64.zip \
            --output "$browser_root/chrome.zip"
          unzip -q "$browser_root/chrome.zip" -d "$browser_root"
          test "$("$browser_root/chrome-linux64/chrome" --version)" = 'Google Chrome for Testing 156.0.8078.47'
          echo "M08_DIAGNOSTIC_CHROME=$browser_root/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Fifteen independent local collector attempts
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/m08-lighthouse-diagnostic
        working-directory: release
        run: node ../diagnostic/scripts/diagnose-lighthouse.mjs
      - name: Preserve diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: m08-linux-lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m08-lighthouse-diagnostic
          if-no-files-found: warn
          retention-days: 30

